# Axiom PR Admission — Archright/nim-libp2p (trusted admission workflow).
#
# Executed by the nim-libp2p ruleset in the TARGET repository context
# (github.repository == 'Archright/nim-libp2p'): every job carries that repo
# guard, so this file is inert on Archright/.github's own PRs (all jobs skip).
# No workflow_dispatch — pull_request is the only trigger.
#
# Subject identity: github.sha of the pull_request event (the PR merge branch
# commit) is the single authority. A non-empty pull_request.merge_commit_sha
# that disagrees with github.sha is an identity-uncertainty rejection — there
# is no head.sha fallback.
#
# Legs: verify-a / verify-b are two SEPARATE jobs calling the pinned reusable
# workflow Archright/axiom-cli/.github/workflows/ax-verify.yml@4ca1892… so each
# leg's reusable-workflow outputs are preserved in their own job namespace
# (a matrix would collapse outputs to the last successful execution).
#
# Fail-closed: admission-integrity and subject-verdict run with !cancelled();
# a missing record, missing report, or any guard violation is recorded and
# FAILs the admission — never silently green.
#
# Classification (v2, 2026-11-14): the verdict is computed from persisted
# engine evidence (ax_proof_state.json, vault-manifest.json), never from the
# process exit code alone. acceptanceClass is a trusted constant declared in
# this workflow (the adoption table), NOT injected into proposals.json:
#   - "law-conformance": exit 0 AND runOutcome.verdict=INCONCLUSIVE AND the
#     adopted proposition's display verdict=UNKNOWN AND every declaredRequired
#     unit has a vault record at candidate-or-better status AND census has
#     >=1 proof candidate / >=1 obligation => LAW_CONFORMANCE_ACCEPTED_
#     REPRODUCIBLE (candidate-tier evidence; explicitly NOT a formal PROVED
#     verdict).
#   - "proof": exit 0 AND verified>0 AND verificationComplete=true AND no
#     FAIL gate AND no DISPROVED proposition => PROVED_REPRODUCIBLE
#     (reserved; unreachable until the engine serializes a positive verdict).
# Exit 0 without the applicable conjuncts => VACUOUS_BLOCKED => FAIL.
name: Axiom PR Admission (nim-libp2p)

on:
  pull_request: {}

permissions:
  contents: read

jobs:
  propositions:
    if: ${{ github.repository == 'Archright/nim-libp2p' }}
    runs-on: ubuntu-24.04
    outputs:
      subject_commit: ${{ steps.subject.outputs.sha }}
      propositions_sha256: ${{ steps.doc.outputs.propositions_sha256 }}
      acceptance_class: ${{ steps.doc.outputs.acceptance_class }}
    steps:
      - name: 'Resolve subject commit (single authority: github.sha)'
        id: subject
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Single authority for pull_request admission is GITHUB_SHA (the newly
          # synthesized refs/pull/<n>/merge commit for [base.sha, head.sha]).
          # NOTE: github.event.pull_request.merge_commit_sha in synchronize webhook
          # payloads is a stale snapshot pointing to the PREVIOUS head's merge commit
          # and is NOT an authority. Instead, enforce that GITHUB_SHA is a valid 40-hex
          # merge commit distinct from both head.sha and base.sha (no head fallback).
          SUBJECT="${GITHUB_SHA}"
          if ! printf '%s' "${SUBJECT}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::subject commit is not a full 40-hex SHA: '${SUBJECT}'"
            exit 1
          fi
          if [ "${SUBJECT}" = "${HEAD_SHA}" ] || [ "${SUBJECT}" = "${BASE_SHA}" ]; then
            echo "::error::subject identity uncertain: github.sha '${SUBJECT}' is not a synthesized merge commit (head='${HEAD_SHA}', base='${BASE_SHA}'); head.sha fallback is forbidden"
            exit 1
          fi
          echo "sha=${SUBJECT}" >> "${GITHUB_OUTPUT}"

      - name: Build pinned propositions document
        id: doc
        env:
          SUBJECT_SHA: ${{ steps.subject.outputs.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ACCEPTANCE_CLASS: 'law-conformance'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys

          subject_sha = os.environ["SUBJECT_SHA"]
          template = '{"schema_version":2,"subject":{"repository":"Archright/nim-libp2p","commit":"__SUBJECT_SHA__"},"agent":{"id":"pr-admission-pinned","version":"1"},"propositions":[{"id":"bytesview-toOpenArray-bv-slice","target":"libp2p/utils/bytesview.nim::toOpenArray","specId":"SPEC-LIBP2P-BV-SLICE","source_location":{"file":"libp2p/utils/bytesview.nim","line":18},"explanation":"Adopted proposition (human adoption record: live campaign external-verification-campaign-001, run 43363278211); formal semantics owned by engine spec catalog SPEC-LIBP2P-BV-SLICE"}]}'
          doc = template.replace("__SUBJECT_SHA__", subject_sha)
          parsed = json.loads(doc)
          propositions = parsed.get("propositions")
          if not isinstance(propositions, list) or len(propositions) < 1:
              print("::error::adopted proposition set is empty (minimum requirement: at least one proposition)")
              sys.exit(1)
          with open("proposals.json", "w", encoding="utf-8") as handle:
              handle.write(doc)
          with open("propositions-summary.md", "w", encoding="utf-8") as handle:
              handle.write("| proposition id | specId |\n")
              handle.write("| --- | --- |\n")
              for proposition in propositions:
                  handle.write(f"| {proposition.get('id')} | {proposition.get('specId')} |\n")
          print(f"subject_commit={subject_sha}")
          for proposition in propositions:
              print(f"proposition id={proposition.get('id')} specId={proposition.get('specId')}")
          PY
          python3 -m json.tool proposals.json > /dev/null
          SHA256_SUM="$(sha256sum proposals.json)"
          SHA256="$(printf '%s' "${SHA256_SUM}" | awk '{print $1}')"
          echo "propositions_sha256=${SHA256}" >> "${GITHUB_OUTPUT}"
          echo "acceptance_class=${ACCEPTANCE_CLASS}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Axiom PR Admission — propositions (pinned)"
            echo ""
            echo "- PR number: #${PR_NUMBER}"
            echo "- head.sha: \`${HEAD_SHA}\`"
            echo "- base.sha: \`${BASE_SHA}\`"
            echo "- subject commit (github.sha): \`${SUBJECT_SHA}\`"
            echo "- propositions_sha256: \`${SHA256}\`"
            echo ""
            cat propositions-summary.md
            echo ""
            echo '```'
            printf '%s\n' "${SHA256_SUM}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload propositions artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: propositions
          path: proposals.json
          if-no-files-found: error

  verify-a:
    if: ${{ github.repository == 'Archright/nim-libp2p' }}
    needs: propositions
    uses: Archright/axiom-cli/.github/workflows/ax-verify.yml@4ca1892a69abcdb9036ec8a69d7bcedc940507d1
    with:
      axiom-version: '0.6.4'
      subject-repository: 'Archright/nim-libp2p'
      subject-commit: '${{ needs.propositions.outputs.subject_commit }}'
      proposals-artifact: 'propositions'
      run-label: 'A'

  verify-b:
    if: ${{ github.repository == 'Archright/nim-libp2p' }}
    needs: propositions
    uses: Archright/axiom-cli/.github/workflows/ax-verify.yml@4ca1892a69abcdb9036ec8a69d7bcedc940507d1
    with:
      axiom-version: '0.6.4'
      subject-repository: 'Archright/nim-libp2p'
      subject-commit: '${{ needs.propositions.outputs.subject_commit }}'
      proposals-artifact: 'propositions'
      run-label: 'B'

  admission-integrity:
    if: ${{ !cancelled() && github.repository == 'Archright/nim-libp2p' }}
    needs: [propositions, verify-a, verify-b]
    runs-on: ubuntu-24.04
    steps:
      - name: Download evidence leg A
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ax-verify-evidence-propositions-A
          path: legs/A

      - name: Download evidence leg B
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ax-verify-evidence-propositions-B
          path: legs/B

      - name: Admission Integrity Checks
        env:
          EXPECTED_SUBJECT_COMMIT: ${{ needs.propositions.outputs.subject_commit }}
          PROPOSITIONS_SHA256: ${{ needs.propositions.outputs.propositions_sha256 }}
          ACCEPTANCE_CLASS: ${{ needs.propositions.outputs.acceptance_class }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import sys

          EXPECTED_REPO = "Archright/nim-libp2p"
          EXPECTED_AXIOM_VERSION = "0.6.4"
          EXPECTED_SUBJECT_COMMIT = os.environ.get("EXPECTED_SUBJECT_COMMIT", "")
          PROPOSITIONS_SHA256 = os.environ.get("PROPOSITIONS_SHA256", "")
          ACCEPTANCE_CLASS = os.environ.get("ACCEPTANCE_CLASS", "")
          GUARD_ORDER = [
              "SUBJECT_IDENTITY",
              "INPUT_EQUALITY",
              "DETERMINISM",
              "EVIDENCE_NON_VACUITY",
              "ZERO_FOOTPRINT",
              "ENVIRONMENT_EQUALITY",
              "EVIDENCE_COHERENCE",
          ]
          TOOLCHAIN_KEYS = ("nim", "z3", "lean", "libpcre3")
          HEX64 = re.compile(r"^[0-9a-f]{64}$")

          violations = {guard: [] for guard in GUARD_ORDER}

          def fail(guard, detail):
              violations[guard].append(detail)

          def find_record(base):
              if not os.path.isdir(base):
                  return None
              for root, _dirs, files in os.walk(base):
                  if "verify-record.json" in files:
                      return os.path.join(root, "verify-record.json")
              return None

          def load_record(path):
              if path is None:
                  return None
              try:
                  with open(path, encoding="utf-8") as handle:
                      data = json.load(handle)
              except (OSError, ValueError):
                  return None
              return data if isinstance(data, dict) else None

          def as_int(value):
              if isinstance(value, bool):
                  return None
              if isinstance(value, int):
                  return value
              if isinstance(value, str) and re.fullmatch(r"[+-]?\d+", value.strip()):
                  return int(value.strip())
              return None

          def as_bool(value):
              if isinstance(value, bool):
                  return value
              if isinstance(value, str):
                  text = value.strip().lower()
                  if text == "true":
                      return True
                  if text == "false":
                      return False
              return None

          leg_paths = {"A": find_record("legs/A"), "B": find_record("legs/B")}
          records = {leg: load_record(path) for leg, path in leg_paths.items()}

          # EVIDENCE_NON_VACUITY — both record files exist and carry real evidence.
          for leg in ("A", "B"):
              if records[leg] is None:
                  fail("EVIDENCE_NON_VACUITY", f"leg {leg}: verify-record.json missing or unreadable under legs/{leg}")
                  continue
              record = records[leg]
              summary_text = record.get("verdict_summary")
              if not isinstance(summary_text, str) or not summary_text.strip():
                  fail("EVIDENCE_NON_VACUITY", f"leg {leg}: verdict_summary is missing or empty")
              else:
                  # ax-verify.yml projects verdict_summary as
                  # "<runOutcome.verdict>/<runOutcome.gateVerdict>/<display.units[0].propositionVerdict>"
                  # where each fallback token is literal "n/a" (which itself contains "/").
                  # In PR admission the subject is the synthesized PR merge commit (github.sha),
                  # which differs from the static commit recorded in the spec overlay, so
                  # display.units (exact-commit scope projection) is empty while
                  # display.propositions and prove_exit carry the authoritative verdict.
                  # Non-vacuity therefore requires non-"n/a" machine outcome tokens v and gv.
                  m_vs = re.fullmatch(
                      r"(?P<v>n/a|[^/\s]+)/(?P<gv>n/a|[^/\s]+)/(?P<pv>n/a|[^/\s]+)",
                      summary_text.strip(),
                      re.IGNORECASE,
                  )
                  if not m_vs or m_vs.group("v").lower() == "n/a" or m_vs.group("gv").lower() == "n/a":
                      fail("EVIDENCE_NON_VACUITY", f"leg {leg}: verdict_summary has vacuous machine outcome segments: {summary_text!r}")
              prove_exit = as_int(record.get("prove_exit"))
              if prove_exit not in (0, 1, 3):
                  fail("EVIDENCE_NON_VACUITY", f"leg {leg}: prove_exit {record.get('prove_exit')!r} is not one of 0/1/3")
              engine_build_id = record.get("engine_build_id")
              if not isinstance(engine_build_id, str) or not HEX64.fullmatch(engine_build_id):
                  fail("EVIDENCE_NON_VACUITY", f"leg {leg}: engine_build_id {engine_build_id!r} is not 64-hex")

          # SUBJECT_IDENTITY — both legs verified exactly this PR subject with this engine.
          for leg in ("A", "B"):
              record = records[leg]
              if record is None:
                  fail("SUBJECT_IDENTITY", f"leg {leg}: record missing; subject identity unverifiable")
                  continue
              if record.get("subject_repository") != EXPECTED_REPO:
                  fail("SUBJECT_IDENTITY", f"leg {leg}: subject_repository {record.get('subject_repository')!r} != {EXPECTED_REPO!r}")
              if str(record.get("subject_commit", "")) != EXPECTED_SUBJECT_COMMIT:
                  fail("SUBJECT_IDENTITY", f"leg {leg}: subject_commit {record.get('subject_commit')!r} != {EXPECTED_SUBJECT_COMMIT!r}")
              if str(record.get("axiom_version", "")) != EXPECTED_AXIOM_VERSION:
                  fail("SUBJECT_IDENTITY", f"leg {leg}: axiom_version {record.get('axiom_version')!r} != {EXPECTED_AXIOM_VERSION!r}")

          # INPUT_EQUALITY — both legs consumed the same pinned propositions document.
          proposals_sha = {leg: (records[leg].get("proposals_sha256") if records[leg] else None) for leg in ("A", "B")}
          if records["A"] is None or records["B"] is None:
              fail("INPUT_EQUALITY", "record(s) missing; proposals_sha256 equality unverifiable")
          elif proposals_sha["A"] is None or proposals_sha["B"] is None or proposals_sha["A"] != proposals_sha["B"]:
              fail("INPUT_EQUALITY", f"proposals_sha256 mismatch: A={proposals_sha['A']!r} B={proposals_sha['B']!r}")

          # DETERMINISM — both legs report the same real 64-hex canonical digest.
          canonical = {leg: (records[leg].get("canonical_digest") if records[leg] else None) for leg in ("A", "B")}
          if records["A"] is None or records["B"] is None:
              fail("DETERMINISM", "record(s) missing; canonical_digest comparison unverifiable")
          else:
              for leg in ("A", "B"):
                  value = canonical[leg]
                  if not isinstance(value, str) or not HEX64.fullmatch(value):
                      fail("DETERMINISM", f"leg {leg}: canonical_digest {value!r} is not 64-hex")
              if canonical["A"] != canonical["B"]:
                  fail("DETERMINISM", f"canonical_digest diverged: A={canonical['A']!r} B={canonical['B']!r}")

          # ZERO_FOOTPRINT — subject tree untouched on both legs.
          for leg in ("A", "B"):
              record = records[leg]
              if record is None:
                  fail("ZERO_FOOTPRINT", f"leg {leg}: record missing; zero-footprint unverifiable")
                  continue
              if as_bool(record.get("zero_footprint_ok")) is not True:
                  fail("ZERO_FOOTPRINT", f"leg {leg}: zero_footprint_ok {record.get('zero_footprint_ok')!r} is not true")
              pre = record.get("pre_tree_hash")
              post = record.get("post_tree_hash")
              if not isinstance(pre, str) or not pre or not isinstance(post, str) or not post or pre != post:
                  fail("ZERO_FOOTPRINT", f"leg {leg}: pre_tree_hash/post_tree_hash not equal or invalid: pre={pre!r} post={post!r}")

          # ENVIRONMENT_EQUALITY — identical runner OS family, bundle/engine identity, and 4-toolchain pins.
          # Note: GitHub-hosted runners (`runs-on: ubuntu-24.04`) roll out minor VM snapshot builds
          # (`<ImageOS>/<ImageVersion>`, e.g. `ubuntu24/20261101.360.1` vs `ubuntu24/20261111.370.1`)
          # across concurrent jobs outside workflow control, while ax-verify.yml pins the entire
          # verification toolchain and bundle by SHA-256. Enforce identical non-empty ImageOS family,
          # identical bundle_sha256, identical engine_build_id, and identical 4-toolchain versions,
          # and record both full runner_image strings in the report.
          if records["A"] is None or records["B"] is None:
              fail("ENVIRONMENT_EQUALITY", "record(s) missing; environment equality unverifiable")
          else:
              runner_a = records["A"].get("runner_image")
              runner_b = records["B"].get("runner_image")
              os_a = runner_a.split("/")[0].strip() if isinstance(runner_a, str) and "/" in runner_a else ""
              os_b = runner_b.split("/")[0].strip() if isinstance(runner_b, str) and "/" in runner_b else ""
              if not os_a or not os_b or os_a != os_b:
                  fail("ENVIRONMENT_EQUALITY", f"runner_image OS family mismatch or invalid: A={runner_a!r} B={runner_b!r}")
              if records["A"].get("bundle_sha256") != records["B"].get("bundle_sha256") or not records["A"].get("bundle_sha256"):
                  fail("ENVIRONMENT_EQUALITY", f"bundle_sha256 mismatch: A={records['A'].get('bundle_sha256')!r} B={records['B'].get('bundle_sha256')!r}")
              if records["A"].get("engine_build_id") != records["B"].get("engine_build_id"):
                  fail("ENVIRONMENT_EQUALITY", f"engine_build_id mismatch: A={records['A'].get('engine_build_id')!r} B={records['B'].get('engine_build_id')!r}")
              toolchain_a = records["A"].get("toolchain")
              toolchain_b = records["B"].get("toolchain")
              if not isinstance(toolchain_a, dict) or not isinstance(toolchain_b, dict):
                  fail("ENVIRONMENT_EQUALITY", f"toolchain records missing or invalid: A={toolchain_a!r} B={toolchain_b!r}")
              else:
                  for key in TOOLCHAIN_KEYS:
                      value_a = toolchain_a.get(key)
                      value_b = toolchain_b.get(key)
                      if value_a is None or value_b is None or value_a != value_b:
                          fail("ENVIRONMENT_EQUALITY", f"toolchain.{key} mismatch: A={value_a!r} B={value_b!r}")

          # --- v2: engine-evidence classification (never exit-code alone) ---
          def find_evidence(base, name):
              if not os.path.isdir(base):
                  return None
              for root, _dirs, files in os.walk(base):
                  if name in files:
                      return os.path.join(root, name)
              return None

          def load_json(path):
              if path is None:
                  return None
              try:
                  with open(path, encoding="utf-8") as handle:
                      data = json.load(handle)
              except (OSError, ValueError):
                  return None
              return data if isinstance(data, dict) else None

          engine = {}
          for leg in ("A", "B"):
              base = "legs/" + leg
              engine[leg] = {
                  "state": load_json(find_evidence(base, "ax_proof_state.json")),
                  "vault": load_json(find_evidence(base, "vault-manifest.json")),
              }

          def vault_entries(leg):
              vault = engine[leg]["vault"] or {}
              entries = vault.get("entries")
              return entries if isinstance(entries, list) else []

          def vault_key_set(leg):
              return {(e.get("modulePath"), e.get("functionName"), e.get("status"),
                       e.get("solverMethod"), e.get("irHash"))
                      for e in vault_entries(leg) if isinstance(e, dict)}

          def vault_names(leg):
              return {e.get("functionName") for e in vault_entries(leg) if isinstance(e, dict)}

          def vault_statuses(leg):
              return {e.get("functionName"): e.get("status")
                      for e in vault_entries(leg) if isinstance(e, dict)}

          def census_projection(leg):
              state = engine[leg]["state"] or {}
              census = state.get("census")
              if not isinstance(census, dict):
                  return None
              return (tuple(census.get("proofCandidates") or []),
                      census.get("obligationCount"), census.get("candidateCount"),
                      census.get("proofCandidateCount"))

          for leg in ("A", "B"):
              if engine[leg]["state"] is None:
                  fail("EVIDENCE_COHERENCE", f"leg {leg}: ax_proof_state.json missing or unreadable")
              if engine[leg]["vault"] is None:
                  fail("EVIDENCE_COHERENCE", f"leg {leg}: vault-manifest.json missing or unreadable")

          if all(engine[leg]["vault"] is not None for leg in ("A", "B")):
              if vault_key_set("A") != vault_key_set("B"):
                  fail("EVIDENCE_COHERENCE", "vault entry set diverged between legs A and B")
          if all(engine[leg]["state"] is not None for leg in ("A", "B")):
              if census_projection("A") != census_projection("B"):
                  fail("EVIDENCE_COHERENCE",
                       f"census projection diverged: A={census_projection('A')!r} B={census_projection('B')!r}")
              declared = engine["A"]["state"].get("declaredRequired")
              if not isinstance(declared, list) or not declared:
                  fail("EVIDENCE_COHERENCE", "declaredRequired is missing or empty")
              else:
                  names_a = vault_names("A")
                  for unit_id in declared:
                      name = str(unit_id).split("::")[-1]
                      if name not in names_a:
                          fail("EVIDENCE_COHERENCE",
                               f"declaredRequired unit {unit_id!r} has no vault record (wave-facing name {name!r})")

          def display_proposition(leg):
              state = engine[leg]["state"] or {}
              display = state.get("display")
              if not isinstance(display, dict):
                  return None
              props = display.get("propositions")
              if not isinstance(props, list) or not props:
                  return None
              return props[0] if isinstance(props[0], dict) else None

          def classify():
              if records["A"] is None or records["B"] is None:
                  return "UNCLASSIFIED"
              prove_exit_a = as_int(records["A"].get("prove_exit"))
              prove_exit_b = as_int(records["B"].get("prove_exit"))
              if prove_exit_a is None or prove_exit_b is None:
                  return "UNCLASSIFIED"
              if prove_exit_a != prove_exit_b:
                  return "CONTRADICTION"
              if any(engine[leg]["state"] is None or engine[leg]["vault"] is None for leg in ("A", "B")):
                  return "UNCLASSIFIED"

              state_a = engine["A"]["state"]
              summary = state_a.get("summary") if isinstance(state_a.get("summary"), dict) else {}
              status_counts = summary.get("statusCounts") if isinstance(summary.get("statusCounts"), dict) else {}
              verified = as_int(status_counts.get("verified")) or 0
              failed = as_int(status_counts.get("failed")) or 0
              outcome = state_a.get("runOutcome") if isinstance(state_a.get("runOutcome"), dict) else {}
              verdict = outcome.get("verdict")
              gate = outcome.get("gateVerdict")
              complete = outcome.get("verificationComplete")
              prop = display_proposition("A") or {}
              capability = prop.get("capability") if isinstance(prop.get("capability"), dict) else {}
              verification = prop.get("verification") if isinstance(prop.get("verification"), dict) else {}
              prop_verdict = verification.get("verdict")
              census = state_a.get("census") if isinstance(state_a.get("census"), dict) else {}
              proof_candidates = as_int(census.get("proofCandidateCount")) or 0
              obligations = as_int(census.get("obligationCount")) or 0
              declared = state_a.get("declaredRequired")
              statuses = vault_statuses("A")

              def required_covered(ok_statuses):
                  if not isinstance(declared, list) or not declared:
                      return False
                  for unit_id in declared:
                      name = str(unit_id).split("::")[-1]
                      if statuses.get(name) not in ok_statuses:
                          return False
                  return True

              if prove_exit_a == 0:
                  if ACCEPTANCE_CLASS == "proof":
                      ok = (verified > 0 and complete is True and verdict != "FAIL"
                            and gate != "FAIL" and prop_verdict != "DISPROVED")
                      return "PROVED_REPRODUCIBLE" if ok else "VACUOUS_BLOCKED"
                  if ACCEPTANCE_CLASS == "law-conformance":
                      ok = (verdict == "INCONCLUSIVE" and capability.get("status") == "CAPABLE"
                            and verification.get("attempted") is True and prop_verdict == "UNKNOWN"
                            and required_covered({"certZ3Candidate", "certGreen", "certLeanVerified"})
                            and proof_candidates >= 1 and obligations >= 1)
                      return "LAW_CONFORMANCE_ACCEPTED_REPRODUCIBLE" if ok else "VACUOUS_BLOCKED"
                  return "UNCLASSIFIED"
              if prove_exit_a == 1:
                  red_units = [d for d in (declared or [])
                               if statuses.get(str(d).split("::")[-1]) == "certRed"]
                  ok = failed > 0 and bool(red_units) and prop_verdict == "DISPROVED"
                  return "DISPROVED_REPRODUCIBLE" if ok else "FAILED_NO_DISPROOF"
              if prove_exit_a == 3:
                  return "REFUSAL_REPRODUCIBLE"
              return "UNCLASSIFIED"

          classification = classify()

          pr_metadata = {}
          try:
              with open(os.environ.get("GITHUB_EVENT_PATH", ""), encoding="utf-8") as handle:
                  event = json.load(handle)
              pull_request = event.get("pull_request") or {}
              if isinstance(pull_request, dict):
                  pr_metadata = {
                      "number": pull_request.get("number"),
                      "head_sha": (pull_request.get("head") or {}).get("sha"),
                      "base_sha": (pull_request.get("base") or {}).get("sha"),
                  }
          except (OSError, ValueError, TypeError):
              pr_metadata = {}

          guard_status = {guard: ("FAIL" if violations[guard] else "PASS") for guard in GUARD_ORDER}
          integrity = "PASS" if all(violations[guard] == [] for guard in GUARD_ORDER) else "FAIL"
          if integrity == "FAIL" and classification in (
                  "PROVED_REPRODUCIBLE", "LAW_CONFORMANCE_ACCEPTED_REPRODUCIBLE",
                  "DISPROVED_REPRODUCIBLE", "REFUSAL_REPRODUCIBLE"):
              classification = "CONTRADICTION"

          report = {
              "schema": "admission-integrity-report/1",
              "integrity": integrity,
              "guards": {guard: {"status": guard_status[guard], "violations": violations[guard]} for guard in GUARD_ORDER},
              "classification": classification,
              "acceptance_class": ACCEPTANCE_CLASS,
              "evidence_tier": ("candidate" if classification == "LAW_CONFORMANCE_ACCEPTED_REPRODUCIBLE"
                                else ("verified" if classification == "PROVED_REPRODUCIBLE" else None)),
              "proposition_verdicts": {
                  "A": ((engine["A"]["state"] or {}).get("display", {}) or {}).get("propositions"),
                  "B": ((engine["B"]["state"] or {}).get("display", {}) or {}).get("propositions"),
              },
              "canonical_digest": {"A": canonical["A"], "B": canonical["B"]},
              "prove_exit": {
                  "A": records["A"].get("prove_exit") if records["A"] else None,
                  "B": records["B"].get("prove_exit") if records["B"] else None,
              },
              "subject": {"repository": EXPECTED_REPO, "commit": EXPECTED_SUBJECT_COMMIT},
              "propositions_sha256": PROPOSITIONS_SHA256,
              "pr": pr_metadata,
              "records": {"A": leg_paths["A"], "B": leg_paths["B"]},
          }

          with open("guards.jsonl", "w", encoding="utf-8") as handle:
              for guard in GUARD_ORDER:
                  handle.write(json.dumps({"guard": guard, "status": guard_status[guard], "violations": violations[guard]}) + "\n")

          with open("admission-integrity-report.json", "w", encoding="utf-8") as handle:
              json.dump(report, handle, indent=2)
              handle.write("\n")

          print("== Admission Integrity Checks ==")
          for guard in GUARD_ORDER:
              print(f"GUARD {guard_status[guard]}: {guard}")
              for detail in violations[guard]:
                  print(f"  - {detail}")
          print(f"classification={classification}")
          print(f"canonical_digest A={canonical['A']!r} B={canonical['B']!r}")
          print(f"subject_commit={EXPECTED_SUBJECT_COMMIT}")

          summary_lines = [
              "## Axiom PR Admission — admission integrity",
              "",
              "| guard | status |",
              "| --- | --- |",
          ]
          for guard in GUARD_ORDER:
              summary_lines.append(f"| {guard} | {guard_status[guard]} |")
          summary_lines.extend([
              "",
              f"- classification: **{classification}**",
              f"- canonical_digest A: `{canonical['A']}`",
              f"- canonical_digest B: `{canonical['B']}`",
              f"- subject commit: `{EXPECTED_SUBJECT_COMMIT}`",
              f"- propositions_sha256: `{PROPOSITIONS_SHA256}`",
          ])
          if integrity == "FAIL":
              summary_lines.append("")
              summary_lines.append("### Violations")
              for guard in GUARD_ORDER:
                  for detail in violations[guard]:
                      summary_lines.append(f"- `{guard}`: {detail}")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(summary_lines) + "\n")

          if integrity == "FAIL":
              for guard in GUARD_ORDER:
                  if violations[guard]:
                      print(f"::error::admission integrity guard violated: {guard}: " + "; ".join(violations[guard]))
              sys.exit(1)
          PY

      - name: Upload admission integrity report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admission-integrity-report
          path: |
            guards.jsonl
            admission-integrity-report.json
          if-no-files-found: error

  subject-verdict:
    if: ${{ !cancelled() && github.repository == 'Archright/nim-libp2p' }}
    needs: [propositions, admission-integrity]
    runs-on: ubuntu-24.04
    steps:
      - name: Download admission integrity report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admission-integrity-report
          path: integrity

      - name: Download evidence leg A (engine context only — no re-adjudication)
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ax-verify-evidence-propositions-A
          path: legs/A

      - name: Download evidence leg B (engine context only — no re-adjudication)
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ax-verify-evidence-propositions-B
          path: legs/B

      - name: Subject verdict mapping
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys

          REPORT_PATH = "integrity/admission-integrity-report.json"
          LEG_BASES = {"A": "legs/A", "B": "legs/B"}

          def pr_metadata():
              try:
                  with open(os.environ.get("GITHUB_EVENT_PATH", ""), encoding="utf-8") as handle:
                      event = json.load(handle)
              except (OSError, ValueError, TypeError):
                  return {}
              pull_request = event.get("pull_request") or {}
              if not isinstance(pull_request, dict):
                  return {}
              return {
                  "number": pull_request.get("number"),
                  "head_sha": (pull_request.get("head") or {}).get("sha"),
                  "base_sha": (pull_request.get("base") or {}).get("sha"),
              }

          def engine_verdict_summaries():
              summaries = {}
              for leg, base in LEG_BASES.items():
                  for root, _dirs, files in os.walk(base):
                      if "verify-record.json" not in files:
                          continue
                      try:
                          with open(os.path.join(root, "verify-record.json"), encoding="utf-8") as handle:
                              record = json.load(handle)
                          if isinstance(record, dict):
                              summaries[leg] = {"verdict_summary": record.get("verdict_summary")}
                      except (OSError, ValueError):
                          pass
                      break
              return summaries

          PR_METADATA = pr_metadata()
          ENGINE_SUMMARIES = engine_verdict_summaries()

          def write_outputs(verdict, log_label, reason, report):
              report = report if isinstance(report, dict) else {}
              guards = report.get("guards")
              if not isinstance(guards, dict):
                  guards = {}
              guard_rows = []
              for name, value in guards.items():
                  status = value.get("status") if isinstance(value, dict) else None
                  guard_rows.append((name, status))
              violated = [name for name, status in guard_rows if status != "PASS"]
              integrity = report.get("integrity")
              if not isinstance(integrity, str):
                  integrity = "FAIL"
              canonical = report.get("canonical_digest")
              if not isinstance(canonical, dict):
                  canonical = {}
              subject = report.get("subject")
              if not isinstance(subject, dict):
                  subject = {}
              digest_a = canonical.get("A")
              digest_b = canonical.get("B")
              subject_commit = subject.get("commit")
              propositions_sha256 = report.get("propositions_sha256")
              classification = report.get("classification")

              verdict_doc = {
                  "schema": "admission-verdict/1",
                  "subject_verdict": verdict,
                  "reason": reason,
                  "classification": classification,
                  "acceptance_class": report.get("acceptance_class"),
                  "evidence_tier": report.get("evidence_tier"),
                  "integrity_status": integrity,
                  "violated_guards": violated,
                  "guards": guards,
                  "canonical_digest": {"A": digest_a, "B": digest_b},
                  "subject_commit": subject_commit,
                  "propositions_sha256": propositions_sha256,
                  "pr": PR_METADATA,
                  "engine_verdict_summaries": ENGINE_SUMMARIES,
              }
              with open("admission-verdict.json", "w", encoding="utf-8") as handle:
                  json.dump(verdict_doc, handle, indent=2)
                  handle.write("\n")

              summary_lines = [
                  "## Axiom PR Admission — verdict (two axes)",
                  "",
                  f"### Campaign / Admission Integrity: {integrity}",
                  "",
              ]
              for name, status in guard_rows:
                  summary_lines.append(f"- {name}: {status}")
              if not guard_rows:
                  summary_lines.append("- no guard results available (admission-integrity-report missing or unreadable)")
              summary_lines.extend([
                  "",
                  f"### Subject Verdict: {verdict}",
                  "",
                  f"- reason: {reason}",
                  f"- classification: {classification}",
                  f"- acceptance class: {report.get('acceptance_class')}",
                  f"- evidence tier: {report.get('evidence_tier')}",
                  f"- canonical_digest A: `{digest_a}`",
                  f"- canonical_digest B: `{digest_b}`",
                  f"- subject commit: `{subject_commit}`",
                  f"- propositions_sha256: `{propositions_sha256}`",
              ])
              for leg in ("A", "B"):
                  summary = ENGINE_SUMMARIES.get(leg, {}).get("verdict_summary")
                  if summary:
                      summary_lines.append(f"- engine verdict_summary (leg {leg}): {summary}")
              with open("verdict-summary.md", "w", encoding="utf-8") as handle:
                  handle.write("\n".join(summary_lines) + "\n")
              summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as handle:
                      handle.write("\n".join(summary_lines) + "\n")
              print(f"SUBJECT_VERDICT={verdict} {log_label}".rstrip())
              print(f"reason={reason}")

          report = None
          if os.path.exists(REPORT_PATH):
              try:
                  with open(REPORT_PATH, encoding="utf-8") as handle:
                      loaded = json.load(handle)
                  if isinstance(loaded, dict):
                      report = loaded
              except (OSError, ValueError):
                  report = None

          if report is None:
              write_outputs("FAIL", "(evidence integrity)", "FAIL (evidence integrity): admission-integrity-report.json missing or unreadable", None)
              sys.exit(1)

          guards = report.get("guards")
          if not isinstance(guards, dict):
              guards = {}
          violated = [name for name, value in guards.items() if not (isinstance(value, dict) and value.get("status") == "PASS")]
          integrity = report.get("integrity")
          if integrity != "PASS" or violated:
              detail = ", ".join(violated) if violated else "integrity is not PASS"
              write_outputs("FAIL", "(evidence integrity)", f"FAIL (evidence integrity): {detail}", report)
              sys.exit(1)

          classification = report.get("classification")
          subject = report.get("subject") if isinstance(report.get("subject"), dict) else {}
          subject_commit = subject.get("commit")

          if classification == "PROVED_REPRODUCIBLE":
              write_outputs("PASS", "", "Adopted proposition PROVED reproducibly on the PR subject (both legs)", report)
              sys.exit(0)
          if classification == "LAW_CONFORMANCE_ACCEPTED_REPRODUCIBLE":
              write_outputs("PASS", "", "Adopted proposition accepted reproducibly at its declared acceptance class (law-conformance, candidate-tier evidence — NOT a formal PROVED verdict)", report)
              sys.exit(0)
          if classification == "VACUOUS_BLOCKED":
              write_outputs("FAIL", "(vacuous)", "VACUOUS_BLOCKED — exit 0 observed without the acceptance-class evidence conjuncts (no green without evidence)", report)
              sys.exit(1)
          if classification == "FAILED_NO_DISPROOF":
              write_outputs("FAIL", "(no disproof)", "FAILED_NO_DISPROOF — exit 1 observed without a reproducible certRed counterexample", report)
              sys.exit(1)
          if classification == "DISPROVED_REPRODUCIBLE":
              write_outputs("FAIL", "(disproved)", f"ADOPTED PROPOSITION DISPROVED on PR subject {subject_commit} (reproducible counterexample)", report)
              sys.exit(1)
          if classification == "REFUSAL_REPRODUCIBLE":
              write_outputs("FAIL", "(not ready)", "NOT READY — engine could not adjudicate; pipeline success and subject verdict are separate axes", report)
              sys.exit(1)
          if classification in ("CONTRADICTION", "UNCLASSIFIED"):
              write_outputs("FAIL", "(inconclusive)", f"subject verdict FAIL: classification={classification}", report)
              sys.exit(1)
          write_outputs("FAIL", "(unknown classification)", f"subject verdict FAIL: unknown classification {classification!r}", report)
          sys.exit(1)
          PY

      - name: Upload admission verdict
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admission-verdict
          path: |
            admission-verdict.json
            verdict-summary.md
          if-no-files-found: error
