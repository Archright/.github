# admission-gate — platform orchestrator producing the single admission
# verdict for Archright/Axiom PRs. Enforced via an org-level `workflows`
# ruleset (source repo Archright/.github supplies the definition; target
# repo PRs cannot remove it — the same trust model as landing-integrity).
# Runs on every PR against the merge base.
#
# Enforcement + TCB split (plan hellcat-iceman-havok, Core Invariant):
#   - GITHUB PLATFORM = orchestration identity + freshness. The org
#     `workflows` ruleset pins this file with repository_id 1182157951 and
#     the `sha` field (exact 40-hex after landing; mutable refs forbidden).
#     On Axiom's main ruleset, required_status_checks == ["admission-check"]
#     (this file's verdict job — the check-run context is the JOB NAME) +
#     strict_required_status_checks_policy: true. Those are TWO platform
#     controls over ONE admission execution: execution authority (what runs
#     is fixed by platform SHA) and freshness authority (a stale candidate
#     against a moved base is blocked by strict) — NOT redundant tests. CI
#     runs exactly once per head.
#   - AXIOM (reusable @SHA) = gateway execution (H code, read-only) +
#     closure derivation (B-executed deriver) + evidence/certificate
#     (B-pinned, ledger-only) + NORMAL/ROTATION qualification.
#   - The certificate that mint produces is EVIDENCE — an element of the
#     admission predicate — NOT an authority. Merge authority = GitHub
#     ruleset + native MERGE only (single main mutator).
#   - ③ write-boundary contract: mint runs B-pinned code only, consumes H
#     as data-only inputs, writes to the ledger side-ref only, and cannot
#     mutate main directly (main change = GitHub native MERGE only).
#
# Trigger: pull_request (runs in the target repo with base/head available;
# github.sha = the merge ref = the exact landing-candidate tree). merge_group
# with types [checks_requested] included for merge-queue environments (not
# currently used by Axiom; kept for forward-compatibility — same stance as
# landing-integrity; note: merge_group events carry no pull_request fields,
# so every base/head input below fail-closes by design until a merge-group
# binding is added).
#
# Permissions: top-level contents: read (minimal). Job-level elevation ONLY
# where a job's function requires it: gateway (contents: read — H-code
# execution), tree-identity (actions: read — gateway artifact download),
# admission (actions/pull-requests: read + checks: write — caller grant는
# callee(admission-check.yml)의 top-level 선언과 정확히 일치해야 한다:
# grant < callee 선언이면 호출 그래프 전체가 계획 단계에서 거부되어 0-job
# startup_failure — 2026-09-26 첫 런 실증), mint (contents: write +
# actions/pull-requests: read — the ledger append tier). checks: write는
# admission-callee contract 전용이며 verdict job에는 없다 — verdict의 native
# check run은 platform이 job 자체에서 생성한다 (no API posting).
#
# DAG (jobs + needs, fail-closed everywhere):
#   1. closure-deriver — derive closure(H)/closure(B) + old-anchor sanity
#      (derived(B)==pin@B); H≠B mismatch는 admission의 NORMAL/ROTATION 자격
#      판정으로 위임 (rotation 대응 — 자격 판정은 Axiom B-built code)
#   2. gateway          — runner-pool-acceptance (reusable @SHA, H code)
#   3. tree-identity    — testedTree (from gateway artifact) == mergeTree
#   4. admission        — B-pinned definition → witness + NORMAL/ROTATION
#   5. mint             — certificate to the ledger (B-pinned code, ③)
#   6. admission-check  — verdict job (always() + needs.*.result -> FAILURE;
#      skipped must never render green)

name: admission-gate

on:
  pull_request:
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1 — closure-deriver (C2 derivation authority).
  # The checker-closure definition is EXECUTED FROM B (deriver built from
  # B's own copy of tools/ci/derive_checker_closure.nim — never from H's
  # copy; a PR that tampers the deriver proves nothing). Produces:
  #   derived-H.txt = derived(H), derived-B.txt = derived(B)
  # and enforces the OLD-ANCHOR sanity: derived(B) == pin@B where pin@B is
  # .trustedCheckerTreeClosure in config/trusted_writer_set.json AT B
  # (git show B: — the working tree is PR-influenced, so the pin is read
  # from the base object, mirroring landing-integrity's "base is the
  # authority" rule). Members must be exactly the Tier C set (zero workflow
  # YAMLs — workflow definitions are platform-SHA-governed).
  #   derived(H) != derived(B) is NOT a failure here — it is exactly the
  #   condition ROTATION authorizes; adjudication (NORMAL requires equality,
  #   ROTATION requires allowlist+atomic anchors) happens in the admission
  #   job's qualification (B-built merge_cli Pass) with these sets as input.
  # Fail-closed: deriver non-zero, missing file at B, missing pin key at B,
  # derived(B) != pin@B (rotation without new pin), YAML member found, or
  # required Tier C member absent → job red → verdict red → merge blocked.
  # ──────────────────────────────────────────────────────────────
  closure-deriver:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # Full checkout — the deriver walks git objects at arbitrary refs.
      # Default ref for pull_request = the merge ref; fetch-depth 0 makes
      # base and head history available; the explicit fetch below is the
      # belt-and-braces guarantee that B and H objects exist locally.
      - name: "[closure] Checkout target repo (full history)"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: "[closure] Fetch base (B) and head (H) objects explicitly"
        run: |
          set -euo pipefail
          printf '%s' "$BASE_SHA" | grep -qE '^[0-9a-f]{40}$' \
            || { echo "FAIL: base.sha '$BASE_SHA' not a 40-hex OID (merge_group event? fail-closed forward-compat)" >&2; exit 1; }
          printf '%s' "$HEAD_SHA" | grep -qE '^[0-9a-f]{40}$' \
            || { echo "FAIL: head.sha '$HEAD_SHA' not a 40-hex OID (merge_group event? fail-closed forward-compat)" >&2; exit 1; }
          git fetch --no-tags --force origin "$BASE_SHA" "$HEAD_SHA"

      # C2 rule: B-executed, NOT H's copy. The definition of the closure
      # derivation itself comes from the base object, so a PR cannot
      # influence WHAT is derived, only WHICH H is derived (data).
      - name: "[closure] Extract deriver source FROM B (git show BASE_SHA:tools/ci/derive_checker_closure.nim)"
        run: |
          set -euo pipefail
          fail() { echo "CLOSURE: FAIL — $1 (fail-closed)" >&2; exit 1; }
          printf '%s' "$BASE_SHA" | grep -qE '^[0-9a-f]{40}$' || fail "base.sha '$BASE_SHA' not a 40-hex OID"
          git show "$BASE_SHA":tools/ci/derive_checker_closure.nim > /tmp/deriver.nim \
            || fail "tools/ci/derive_checker_closure.nim missing at B=$BASE_SHA (PR-1 must land the deriver before this gate activates — Phase 3)"
          test -s /tmp/deriver.nim || fail "deriver source extracted empty from B"
          echo "[closure] deriver source extracted from B=$BASE_SHA ($(wc -l < /tmp/deriver.nim) lines)"

      # Inline choosenim pattern (same as runner-pool-acceptance select job):
      # toolchain pinned to 2.2.10 for determinism; the deriver is a pure
      # git-object walker (no compiler internals), so no toolchain
      # setup-axiom action is needed.
      - name: "[closure] Install Nim 2.2.10 (choosenim, pinned)"
        run: |
          set -euo pipefail
          export CHOOSENIM_NO_COLOR=1 CHOOSE_NIM_QUIET=1
          curl -sSf https://nim-lang.org/choosenim/init.sh | sh -s -- -y
          "$HOME/.nimble/bin/choosenim" 2.2.10
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"

      # --skipParentCfg --skipProjCfg: hermetic compile (no repo config.nims
      # can inject behavior into the B-extracted source); --path:src mirrors
      # the repo's own deriver build invocation (runner-pool pattern).
      - name: "[closure] Compile deriver (from B source)"
        run: |
          set -euo pipefail
          nim c --hints:off --skipParentCfg --skipProjCfg --path:src -o:/tmp/deriver /tmp/deriver.nim
          test -x /tmp/deriver || { echo "FAIL: deriver binary missing after nim c" >&2; exit 1; }

      # Derive both sets + OLD-ANCHOR sanity (fail-closed). The pin is read
      # from B (git show), never from the working tree. jq -e fail-closes
      # when .trustedCheckerTreeClosure is absent at B (genesis landed in
      # Axiom #275 — absent pin after genesis = tamper/misconfig → red).
      # derived(H) != derived(B) is intentionally NOT failed here: that
      # mismatch is the ROTATION condition, adjudicated by admission's
      # qualification pass (B-built merge_cli) with these uploaded sets.
      - name: "[closure] Derive closure(H) + closure(B) + old-anchor sanity (fail-closed)"
        run: |
          set -euo pipefail
          fail() { echo "CLOSURE: FAIL — $1 (fail-closed)" >&2; exit 1; }
          printf '%s' "$BASE_SHA" | grep -qE '^[0-9a-f]{40}$' || fail "base.sha '$BASE_SHA' malformed"
          printf '%s' "$HEAD_SHA" | grep -qE '^[0-9a-f]{40}$' || fail "head.sha '$HEAD_SHA' malformed"

          /tmp/deriver --ref "$HEAD_SHA" | LC_ALL=C sort > /tmp/derived-H.txt
          /tmp/deriver --ref "$BASE_SHA" | LC_ALL=C sort > /tmp/derived-B.txt
          # H-side pin copy (the ROTATION candidate's proposed anchor) —
          # JSONC verbatim; the admission-side parser strips comments.
          git show "$HEAD_SHA":config/trusted_writer_set.json > /tmp/pin-H.json \
            || fail "config/trusted_writer_set.json missing at H=$HEAD_SHA"
          git show "$BASE_SHA":config/trusted_writer_set.json \
            | sed -E 's|^[[:space:]]*//.*$||' \
            | jq -e -r '.trustedCheckerTreeClosure | to_entries | sort_by(.key)[]
                     | "\(.value.mode) \(.value.type) \(.value.sha)\t\(.key)"' \
            | LC_ALL=C sort > /tmp/pin_B.txt \
            || fail "config/trusted_writer_set.json@B has no trustedCheckerTreeClosure object (post-genesis the key must exist — absence = tamper/misconfig)"

          cmp /tmp/derived-B.txt /tmp/pin_B.txt \
            || fail "derived(B) != pin@B — B's derived closure diverges from the trusted pin at B (old anchor invalid; rotation must carry the new pin atomically)"

          # Members sanity = exactly the Tier C set: required members present ...
          for member in \
              "ci/checker.mk" \
              "tools/ci/derive_checker_closure.nim" \
              "tools/ci/impact_closure_selector.nim" \
              "tools/ci/proof_reconcile_gate.nim" \
              "tests/gateway/all_gateway_runner.nim"; do
            grep -qE "[[:space:]]${member}\$" /tmp/pin_B.txt || fail "Tier C member missing from closure: $member"
          done
          # ... and zero workflow YAMLs (workflow definitions are governed
          # by the platform SHA pin, never by the closure).
          YML_COUNT="$(grep -cE '\.(yml|yaml)$' /tmp/pin_B.txt || true)"
          [ "$YML_COUNT" -eq 0 ] || fail "closure contains $YML_COUNT workflow YAML member(s) — closure expansion forbidden"

          echo "CLOSURE: anchor OK — derived(B)==pin@B ($(wc -l < /tmp/pin_B.txt) entries, $YML_COUNT yml); derived(H) uploaded for NORMAL/ROTATION adjudication ($(wc -l < /tmp/derived-H.txt) entries)"

      - name: "[closure] Upload derived-closure sets (admission qualification input)"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: derived-closure
          path: |
            /tmp/derived-H.txt
            /tmp/derived-B.txt
            /tmp/pin-H.json
          retention-days: 7
  # ──────────────────────────────────────────────────────────────
  # Job 2 — gateway. Executes the Axiom gateway acceptance pool as a
  # reusable workflow pinned to the exact Axiom commit (H-code execution —
  # this is where the PR's own code is tested, under a READ-ONLY token).
  #   target_sha = github.sha: for pull_request events github.sha IS the
  #   merge ref (base⊕head) = the exact landing-candidate tree — the tree
  #   the gateway must have tested, and the tree mergeTree is compared
  #   against. force_full = false (caller context selection semantics).
  # ──────────────────────────────────────────────────────────────
  gateway:
    needs: [closure-deriver]
    # H-code execution: read-only token — the gateway tests the PR tree,
    # it must never be able to write anything from it.
    permissions:
      contents: read
    # SHA-pinned to Axiom 50d556fc7 (mint fi-fix — #286 착지 후 main 조상; SHA-only — @branch/@tag FORBIDDEN, rotation = §7)
    uses: Archright/Axiom/.github/workflows/runner-pool-acceptance.yml@50d556fc721f47bc98e5a5de02c9f63bf83c7ecf
    with:
      # inputs confirmed against main's workflow_call: target_sha (string, required) + force_full (bool, default false)
      target_sha: ${{ github.sha }}
      force_full: false
  # ──────────────────────────────────────────────────────────────
  # Job 3 — tree-identity. The gateway's testedTreeDigest (fetched from
  # the gateway job's artifact on THIS run) must equal mergeTree = the
  # landing candidate's tree (tree of github.sha). Digest equality =
  # "Axiom verified exactly the object identity that will land" — a strict
  # complement to the platform's strict freshness (stale-candidate check).
  # Fail-closed: artifact missing, digest malformed, or mismatch → red.
  # ──────────────────────────────────────────────────────────────
  tree-identity:
    needs: [gateway]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # actions: read — required to download the gateway job's artifact
      actions: read
    outputs:
      mergeTreeDigest: ${{ steps.merge.outputs.mergeTreeDigest }}
      testedTreeDigest: ${{ steps.check.outputs.testedTreeDigest }}
    steps:
      - name: "[identity] Checkout target repo (github.sha object)"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: "[identity] Compute mergeTree = tree(github.sha) (merge candidate)"
        id: merge
        run: |
          set -euo pipefail
          fail() { echo "IDENTITY: FAIL — $1 (fail-closed)" >&2; exit 1; }
          MERGE_SHA="${{ github.sha }}"
          printf '%s' "$MERGE_SHA" | grep -qE '^[0-9a-f]{40}$' || fail "github.sha '$MERGE_SHA' not a 40-hex OID"
          MERGE_TREE="$(git rev-parse "$MERGE_SHA^{tree}")" || fail "cannot resolve $MERGE_SHA^{tree}"
          echo "mergeTreeDigest=$MERGE_TREE" >> "$GITHUB_OUTPUT"
          echo "ADM_MERGE_TREE=$MERGE_TREE" >> "$GITHUB_ENV"
          echo "[identity] mergeTree=$(git rev-parse "$MERGE_SHA" | cut -c1-12)...^{tree} = $MERGE_TREE (merge ref — exact landing candidate)"

      # artifact name/member published by Axiom runner-pool-acceptance
      # (select job) — landed in Axiom PR #274: `tested-tree-digest`
      # containing file `testedTreeDigest`.
      - name: "[identity] Download gateway testedTreeDigest artifact"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-tree-digest
          path: gateway-digest

      - name: "[identity] Assert testedTree == mergeTree (fail-closed)"
        id: check
        run: |
          set -euo pipefail
          fail() { echo "IDENTITY: FAIL — $1 (fail-closed)" >&2; exit 1; }
          TESTED="$(cat gateway-digest/testedTreeDigest)" || fail "testedTreeDigest file missing in gateway artifact"
          printf '%s' "$TESTED" | grep -qE '^[0-9a-f]{40}$' || fail "testedTreeDigest '$TESTED' not a 40-hex tree OID"
          [ "$TESTED" = "$ADM_MERGE_TREE" ] \
            || fail "testedTreeDigest '$TESTED' != mergeTree '$ADM_MERGE_TREE' — the gateway did not test the landing candidate tree"
          echo "testedTreeDigest=$TESTED" >> "$GITHUB_OUTPUT"
          echo "IDENTITY: OK — gateway tested tree == merge candidate tree ($TESTED)"
  # ──────────────────────────────────────────────────────────────
  # Job 4 — admission. B-pinned definition (workflow_call: {} — the callee
  # derives every B/H/PR fact from the propagated pull_request caller
  # context; no inputs are passed). Produces witness + NORMAL/ROTATION
  # qualification for this exact candidate; consumes the derived-closure
  # sets uploaded by closure-deriver (same-run artifact) when present so
  # its qualification pass can adjudicate NORMAL (closure equality) vs
  # ROTATION (allowlist + atomic anchors).
  # ──────────────────────────────────────────────────────────────
  admission:
    needs: [tree-identity]
    permissions:
      contents: read
      actions: read
      pull-requests: read
      # checks: write — CALLEE(admission-check.yml) top-level 선언과의
      # permissions 계약: caller grant < callee 선언이면 호출 그래프 전체가
      # 계획 단계에서 거부되어 0-job startup_failure(공식 규칙 — GITHUB_TOKEN
      # 권한은 caller에서 downgrade만 가능; 2026-09-26 첫 런 실증). callee의
      # landing-trigger Check Run POST가 이 스코프를 사용한다.
      checks: write
    # SHA-pinned to Axiom 50d556fc7 (mint fi-fix — #286 착지 후 main 조상; SHA-only — @branch/@tag FORBIDDEN, rotation = §7)
    uses: Archright/Axiom/.github/workflows/admission-check.yml@50d556fc721f47bc98e5a5de02c9f63bf83c7ecf
    # workflow_call inputs: none (on.workflow_call == {}) — caller context propagates.
  # ──────────────────────────────────────────────────────────────
  # Job 5 — mint. Certificate publication to the ledger side-ref only.
  #
  # ③ write-boundary contract (plan Phase 0-③, TrustedWriterSet meaning):
  #   mint job = B-pinned code만 실행 (definition @SHA + verifier built
  #     from B inside the called workflow)
  #   + H는 data-only input (headSha 등 — H 코드는 mint에서 실행/빌드 금지)
  #   + write destination = ledger (refs/heads/axiom/certificates) 한정
  #   + main 직접 mutation = 불가 (main 변경 = GitHub native MERGE 하나뿐 —
  #     M-B 결속). contents: write는 path-level capability가 아니므로
  #     "ledger only"는 계약이며 보장은 (a) B-pinned code + architect
  #     review, (b) H data-only, (c) M-B 결속이다.
  # ──────────────────────────────────────────────────────────────
  mint:
    needs: [admission]
    permissions:
      contents: write
      actions: read
      pull-requests: read
    # SHA-pinned to Axiom 50d556fc7 (mint fi-fix — #286 착지 후 main 조상; SHA-only — @branch/@tag FORBIDDEN, rotation = §7)
    uses: Archright/Axiom/.github/workflows/certificate-mint.yml@50d556fc721f47bc98e5a5de02c9f63bf83c7ecf
    with:
      # inputs = the landed on.workflow_call.inputs contract (all required,
      # camelCase); the callee's activation guard re-verifies every value
      # against the actions/PR API before minting.
      runId: ${{ github.run_id }}
      runAttempt: ${{ github.run_attempt }}
      headSha: ${{ github.event.pull_request.head.sha || github.sha }}
      baseSha: ${{ github.event.pull_request.base.sha || github.sha }}
      prNumber: ${{ github.event.pull_request.number }}
  # ──────────────────────────────────────────────────────────────
  # Job 6 — verdict. REQUIRED STATUS CONTEXT: the check run for THIS job
  # is named after the job (Actions check-run name = job name), so the job
  # id AND name are `admission-check` — the single context the main
  # ruleset's required_status_checks == ["admission-check"] binds to.
  #
  # Fail-closed (plan 구멍 11·14): if: ${{ always() }} so the verdict runs
  # even when an upstream job fails or SKIPS, then every needed job's
  # result is evaluated — a skipped job has result 'skipped' and is
  # converted to FAILURE, never green. A required status check that is
  # absent/skipped would otherwise look satisfied to the ruleset.
  # ──────────────────────────────────────────────────────────────
  admission-check:
    name: admission-check
    needs: [closure-deriver, gateway, tree-identity, admission, mint]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "[verdict] Every needed job must be success (skipped -> FAILURE, never green)"
        env:
          RESULT_CLOSURE_DERIVER: ${{ needs.closure-deriver.result }}
          RESULT_GATEWAY: ${{ needs.gateway.result }}
          RESULT_TREE_IDENTITY: ${{ needs.tree-identity.result }}
          RESULT_ADMISSION: ${{ needs.admission.result }}
          RESULT_MINT: ${{ needs.mint.result }}
        run: |
          set -euo pipefail
          fail() { echo "ADMISSION_GATE: FAIL — $1 (fail-closed)" >&2; exit 1; }
          for pair in \
              "closure-deriver:$RESULT_CLOSURE_DERIVER" \
              "gateway:$RESULT_GATEWAY" \
              "tree-identity:$RESULT_TREE_IDENTITY" \
              "admission:$RESULT_ADMISSION" \
              "mint:$RESULT_MINT"; do
            JOB="${pair%%:*}"; RESULT="${pair#*:}"
            [ "$RESULT" = "success" ] \
              || fail "needed job '$JOB' result='$RESULT' (expected 'success' — skipped/cancelled/failed must block, never green)"
          done
          echo "[verdict] OK — all 5 needed jobs succeeded"

      # Admission evidence from the admission job's uploaded artifact
      # (admission-check-<PR>: witness.json + admission-verdict.log — the
      # dry-run --json output carrying `qualification`).
      - name: "[verdict] Download admission evidence artifact"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: admission-check-${{ github.event.pull_request.number }}
          path: admission-artifact

      # Admission predicate (certificate ∈ predicate — ②): identity
      # outputs match + qualification ∈ {NORMAL, ROTATION} + certificate
      # issued & verified == mint job success (mint's own gates: witness
      # provenance re-verification, D6, FF-CAS ledger-append — a red mint
      # never reaches here green). GREEN only when every element holds
      # (all evidence complete pre-landing).
      # TODO(PHASE-4 identity PR): certTree==mergeTree ledger audit joins
      # this predicate once the witness/ certTree digest chain lands in
      # Axiom (ADR-0025 잔여 한계 — 착지 후 audit observation과 별개).
      - name: "[verdict] Admission predicate: identity + qualification + certificate (GREEN)"
        env:
          MERGE_TREE_DIGEST: ${{ needs.tree-identity.outputs.mergeTreeDigest }}
          TESTED_TREE_DIGEST: ${{ needs.tree-identity.outputs.testedTreeDigest }}
        run: |
          set -euo pipefail
          fail() { echo "ADMISSION_GATE: FAIL — $1 (fail-closed)" >&2; exit 1; }
          printf '%s' "$MERGE_TREE_DIGEST" | grep -qE '^[0-9a-f]{40}$' \
            || fail "mergeTreeDigest '$MERGE_TREE_DIGEST' missing/malformed (tree-identity output)"
          [ "$TESTED_TREE_DIGEST" = "$MERGE_TREE_DIGEST" ] \
            || fail "testedTreeDigest '$TESTED_TREE_DIGEST' != mergeTreeDigest '$MERGE_TREE_DIGEST' (identity mismatch)"
          # admission-verdict.log = stderr log lines + ONE stdout JSON line
          # (agent-54 contract: stdout carries exactly {"prNumber":...}) —
          # extract the JSON line first, then parse qualification from it.
          JSON_LINE="$(grep -o '{"prNumber":[0-9]*,.*' admission-artifact/admission-verdict.log | tail -n 1 || true)"
          [ -n "$JSON_LINE" ] || fail "qualification JSON line not found in admission-verdict.log (evidence integrity)"
          QUALIFICATION="$(printf '%s' "$JSON_LINE" | jq -r '.qualification // empty' || true)"
          [ -n "$QUALIFICATION" ] || fail "qualification field missing/unparseable in JSON line (evidence integrity)"
          case "$QUALIFICATION" in
            NORMAL|ROTATION) ;;
            *) fail "qualification '$QUALIFICATION' — expected NORMAL or ROTATION" ;;
          esac
          # certificate issued & verified: mint job success is asserted in
          # step 1; mint's internal gates are the certificate verification.
          echo "ADMISSION_GATE: GREEN — identity ✓ qualification=$QUALIFICATION ✓ certificate issued (mint green) ✓ (all pre-landing evidence satisfied)"
