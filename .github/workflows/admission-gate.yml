# ────────────────────────────────────────────────────────────────
# admission-gate — Control Kernel (K). N+1 activation
# (CI Quantization prefix construction — Bootstrap Authority 창의 ③,
# 새 I-chain 형성). Epoch N+4 extension: mint-prepare 래퍼 신설
# (SL-12 certificate mint prepare — certificate-mint.yml@N+4 main sha,
# needs [admission]) + verdict needs [admission, mint-prepare] — verdict
# = callee result 단일 판정의 확장 (둘 다 success만 GREEN, fail-closed).
# Epoch N+5 extension: mint-publish 래퍼 신설 (SL-04 certificate
# validity — certificate-mint.yml@N+5 main sha, stage=publish,
# needs [mint-prepare]) + verdict needs [admission, mint-prepare,
# mint-publish] — SL-04 [X]1~3 검증 발화를 verdict에 결속 (셋 다
# success만 GREEN). C5/C1 계약 개정 반영: callee prepare는 N+5 main부터
# build-base-artifacts 소비 (자체빌드 폐기).
# Epoch N+6 extension: gateway 래퍼 신설 (SL-10 gateway decision
# identity — runner-pool-acceptance.yml@N+6 main sha, needs 없음:
# callee select는 GITHUB_SHA만 소비) + verdict needs [admission,
# mint-prepare, mint-publish, gateway] — SL-10 decision envelope
# 발화 + gateway lane 결과를 verdict에 결속 (넷 다 success만 GREEN).
# FORWARD (2026-09-29, 복구 D3): 수리 PR #331/#332/#333/#334 착지 —
# K를 N+5 shape로 복귀 (양쪽 래퍼 @c55f0482e — ircheck 소비 + P3 mkdir
# + libpcre3 패리티 prepare·publish). N+5는 복구 E의 acceptance green
# 까지 미완·전이 상태.
# STAGE-SPLIT cutover: 단일 `admission` job이 witness 산출과 MergeAdmissible
# 판정을 겸하던 것을 두 stage 호출로 분리한다 —
#   attest(stage: attest) ─> mint-prepare ────────────────┐
#   gateway(독립 레인) ───────────────────────────────────┴─> mint-publish ─> verdict(stage: verdict)
#     (mint-publish needs [mint-prepare, gateway] — gateway lane이
#      terminal이 된 뒤 publish가 평가한다. 2026-10-07 run
#      37569755722 att.1 레이스 복원 — 아래 mint-publish 주석)
#   closure-deriver(needs-free 생산자 레인) ──> gateway · verdict
#     (SL-02 Phase 1-a 복구 — derived-closure 4파일 게시 완료가 모든
#      H 코드 실행 job 시작에 선행: V-H 아티팩트 레이스 차단.
#      아래 closure-deriver 주석)
#   └─────────────── 여섯 job 모두 success ───────────────> admission-check (aggregate)
# 분리 근거: `admission`이 predicate까지 수행하면 predicate가 cert를 읽는
# 시점이 mint-publish보다 앞서서 attempt 1이 NO_CERT로 닫히고 무조건 2차
# attempt가 필요했다(2026-10-04 run 37199503612 실측, Axiom#466이 callee를
# 두 stage로 분할). MUST 체인은 4중 → 5중으로 강화될 뿐 제거된 MUST는 없다.
#
# K = "GitHub가 이 epoch을 실행하게 하는 최소 제어 장치" (핸들만 —
# semantic 엔진 코드 잔존 금지). semantic 실행 범위는 callee
# (admission-check.yml@B / certificate-mint.yml@B) 내부의 Slice Engine
# 게이트가 운전한다: manifest(config/policy/epoch_manifest.json @B)
# implementedSlices에서 구현 slice 단계만 발화하고, 미정착 slice 단계는
# 실행 목록에서 제외되어 NO-FIRE (I-3 — skip이 아니라 미발화). verdict는
# callee result 단일 판정 — callee 내부의 fail-closed manifest 파싱 +
# 슬라이스 검증이 epoch의 semantics다.
#
# required check context = admission-check (JOB NAME) 불변 — 이 파일의
# 존재 조건. org ruleset 24041674(axiom-admission-gate)의 workflows
# 규칙이 이 파일을 sha pin하며, Axiom repo ruleset 20303214의
# required_status_checks == ["admission-check"]가 verdict를 소비한다.
# required check 이름·bypass_actors·enforcement 공백은 전부 불변.
#
# 구 엔진(5-job DAG: closure-deriver / gateway / tree-identity /
# admission / mint-prepare / mint-publish — 마지막 상태 freeze tag
# 94a6f0864, old-ci-freeze-20260928)에서 K가 제거한 것 (I-3 미정착
# slice — 무엇이 빠지는지 대조용 참조만, 복사 아님):
#   closure-deriver — SL-02 deriver 컴파일·실행 + closure 등식
#                     (callee 내부 derived-closure load도 scope_sl02
#                      게이트로 NO-FIRE)
#                     [SL-02 Phase 1-a 복구, 2026-10-10] 생산자만 재창설 —
#                     아래 closure-deriver job이 derived-closure 4파일을
#                     게시한다. closure 등식 판정(3중 등식·fail-closed)은
#                     callee 소관이며 소비자 측은 별도 계약으로 착지한다 —
#                     본 파일은 게시(determinism·순서·권한)만 고정한다.
#   gateway         — runner-pool-acceptance H-code 전면 실행; epoch N+6
#                     (SL-10)에서 부활 (아래 gateway 래퍼) — callee 내부
#                     [slice-engine] scope_sl10 게이트로 decision
#                     envelope 발화 제한 (첫 runner-pool 증분)
#   tree-identity   — testedTree==mergeTree 등식 (callee가 mergeTree
#                     재유도 = 순수 중복)
#   mint-prepare    — epoch N+4 (SL-12)에서 부활 (아래 mint-prepare
#                     래퍼) — certificate-mint prepare read tier
#   mint-publish    — epoch N+5 (SL-04)에서 부활 (아래 mint-publish
#                     래퍼) — certificate-mint publish write tier;
#                     publish 내부 P0/P5/P6/P7은 scope_sl0713 게이트로
#                     NO-FIRE (SL-0713 미정착 — D6/[B2] 대기)
# verdict 다단계(identity+qualification+certificate predicate)도 축소 —
# K verdict = callee result 단일 판정 (fail-closed, "never green").
#
# Bootstrap Bridge(org PR #16, a7668c898)는 R0 선언 시점에 조기 퇴역 —
# 본 파일이 그 자리에 새 I-chain을 처음 형성한다 (B10 창의 ③,
# I-12 1회성).
# ────────────────────────────────────────────────────────────────
name: admission-gate

on:
  pull_request:
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────
  # closure-deriver — SL-02 Phase 1-a 생산자 복원 (구 엔진 freeze tag
  # 94a6f0864 = old-ci-freeze-20260928의 동명 job 재작성 — 복사가 아니라
  # 확정 계약에 따른 재작성).
  #   산출 = same-run artifact `derived-closure`, all-or-none 4파일:
  #     derived-H.txt / derived-B.txt — deriver 포맷 `<mode> <type> <sha>\t<path>`
  #       (git ls-tree 포맷 그대로), LC_ALL=C 정렬. deriver 실행은
  #       --ref H / --ref B 각 1회, 출력을 파일로 (런 내 재실행 0 —
  #       소비자 L2의 deriver-재실행 digest 등식이 같은 산출을 재현한다).
  #     pin-H.json — git show H:config/trusted_writer_set.json 원문(JSONC).
  #     identity.json — {schema:"axiom/derived-closure-identity/v1",
  #       candidateHeadSha(파생 ref H — MG에서는 G=merge_group.head_sha),
  #       baseSha(B), pinHeadBlobSha(blob of trusted_writer_set.json@H),
  #       runAttempt} — 전부 40-hex/정수 검증 후 업로드.
  #     pin@B는 담지 않는다 — 소비자가 B 워크스페이스에서 직접 읽는 현행
  #     단일 경로 유지(이중 경로 금지). MG head 이중성(G vs G²=parents[1])
  #     의 주체(G²) 연결도 소비자 측 parent2 재유도가 담당 — 이 job은
  #     G를 그대로 기록한다(이벤트 중립 입력의 사실 그대로).
  #   도출 = B-고정 hermetic (C2 — PR(H)의 deriver가 아니라 B의 deriver):
  #     git worktree add --detach /tmp/btree B → 그 트리 안에서만 컴파일.
  #     import closure는 프로젝트 4파일 정확히(derive_checker_closure.nim +
  #     core/trusted/{layer_declaration,axiom_pragmas_lite,effect_bridge}.nim —
  #     모두 B 트리 소속, nimble 의존 0)이며 컴파일 플래그는
  #     --skipParentCfg --skipProjCfg --skipUserCfg --noNimblePath --path:src
  #     (구 엔진 대비 잔여 정직화: 사용자 cfg·NimblePath 역유입 차단).
  #     툴체인은 setup-axiom-toolchain composite 액션(Axiom, 커밋 SHA 핀 —
  #     nim 2.2.10 핀 + 지문(a-key) + 프로브 3층)으로 통일 — 구 엔진의
  #     인라인 `curl … choosenim` 설치(unpinned 원격 스크립트)는 폐기.
  #   DAG 고정 (V-H 레이스 차단): needs-free(타 job 산출물 0 — B/H git
  #     사실만 소비)로 그래프 head에 배치하고, gateway·verdict가 본 job을
  #     needs로 요구한다 — 모든 잠재 경쟁 게시자(H 코드 실행 job)는 생산자
  #     게시 완료 후에만 시작된다. 업로드는 overwrite 없음 +
  #     if-no-files-found: error — 이름 `derived-closure` 선점 실패 또는
  #     파일 결손 = 생산자 red = aggregate red (fail-closed, never green).
  #   권한: job-level permissions 선언 없음 → 상위 contents: read 상속.
  #     actions: write 없음 — 아티팩트 삭제 경로 부존재 유지.
  #   극장 방지 명시: 이 job은 closure 등식을 판정하지 않는다 — 구 엔진의
  #     old-anchor sanity(derived(B)==pin@B)도 재도입하지 않는다. 판정은
  #     callee verdict의 소관(closureEqual 3중 등식 + L1/L2)이며, 여기서는
  #     사실(B/H/pin@H/도출 결과)을 결정론적으로 게시만 한다.
  #   운영 참고: 본 워크플로는 org ruleset(axiom-admission-gate)의 required
  #     workflow로 Axiom 저장소의 PR/MG 이벤트에서 실행된다. .github 저장소
  #     자체 PR에서는 이벤트 B/H가 org 커밋이라 B 트리에 Axiom 경로가 없어
  #     본 job이 fail-closed red — self-PR 런은 기존에도 전부 failure였던
  #     상태와 동일(필수 체크는 pin-promotion-gate가 별도)이다.
  # ──────────────────────────────────────────────────────────────
  closure-deriver:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      # Full checkout — deriver는 임의 ref의 git 객체를 걷는다(+아래 명시
      # fetch가 belt-and-braces). 체크아웃 대상 = 이벤트 소유 저장소
      # (required-workflow 경로 = Archright/Axiom).
      - name: "[closure] Checkout event repo (full history)"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: "[closure] Event-neutral B/H inputs — 40-hex fail-closed + explicit fetch"
        run: |
          set -euo pipefail
          fail() { echo "CLOSURE: FAIL — $1 (fail-closed)" >&2; exit 1; }
          printf '%s' "$BASE_SHA" | grep -qE '^[0-9a-f]{40}$' \
            || fail "base(B)='$BASE_SHA' not a 40-hex OID (event-neutral input empty — unsupported event shape?)"
          printf '%s' "$HEAD_SHA" | grep -qE '^[0-9a-f]{40}$' \
            || fail "head(H)='$HEAD_SHA' not a 40-hex OID (event-neutral input empty — unsupported event shape?)"
          git fetch --no-tags --force origin "$BASE_SHA" "$HEAD_SHA"

      # C2 rule: B-executed, NOT H's copy — the definition of the closure
      # derivation itself comes from the base object, so a candidate cannot
      # influence WHAT is derived, only WHICH H is derived (data).
      - name: "[closure] B worktree — derivation executes from the B tree only"
        run: |
          set -euo pipefail
          fail() { echo "CLOSURE: FAIL — $1 (fail-closed)" >&2; exit 1; }
          git worktree add --detach /tmp/btree "$BASE_SHA" \
            || fail "git worktree add --detach /tmp/btree at B=$BASE_SHA failed"
          test -s /tmp/btree/tools/ci/derive_checker_closure.nim \
            || fail "tools/ci/derive_checker_closure.nim missing at B=$BASE_SHA"
          for member in layer_declaration axiom_pragmas_lite effect_bridge; do
            test -s "/tmp/btree/src/core/trusted/$member.nim" \
              || fail "src/core/trusted/$member.nim missing at B=$BASE_SHA (deriver import closure incomplete at B)"
          done

      - name: "[closure] Pinned toolchain (setup-axiom-toolchain — nim 2.2.10, no inline choosenim)"
        uses: Archright/Axiom/.github/actions/setup-axiom-toolchain@88b52abece2f18272d90f48883f7f1df699faaca
        with:
          cache-save-enabled: 'false'
          cache-build-source: ${{ env.BASE_SHA }}

      # cwd = /tmp/btree : nimc의 cwd-우선 규칙 + --path:src(B 트리 상대)로
      # 프로젝트 import의 워킹 트리(H) 역유입이 구조적으로 부재.
      - name: "[closure] Compile deriver inside the B tree (hermetic flags)"
        run: |
          set -euo pipefail
          fail() { echo "CLOSURE: FAIL — $1 (fail-closed)" >&2; exit 1; }
          cd /tmp/btree
          nim c --hints:off --skipParentCfg --skipProjCfg --skipUserCfg --noNimblePath --path:src \
            -o:/tmp/deriver tools/ci/derive_checker_closure.nim \
            || fail "deriver compile from the B tree failed (import closure must be exactly: deriver + core/trusted/{layer_declaration,axiom_pragmas_lite,effect_bridge}.nim, nimble deps 0)"
          test -x /tmp/deriver || fail "deriver binary missing after nim c"

      - name: "[closure] Derive closure(H) + closure(B) + pin@H + identity.json (fail-closed)"
        run: |
          set -euo pipefail
          fail() { echo "CLOSURE: FAIL — $1 (fail-closed)" >&2; exit 1; }
          printf '%s' "$BASE_SHA" | grep -qE '^[0-9a-f]{40}$' || fail "base(B) malformed"
          printf '%s' "$HEAD_SHA" | grep -qE '^[0-9a-f]{40}$' || fail "head(H) malformed"

          /tmp/deriver --ref "$HEAD_SHA" | LC_ALL=C sort > /tmp/derived-H.txt \
            || fail "deriver --ref H failed (UNRESOLVED members — fail-closed)"
          /tmp/deriver --ref "$BASE_SHA" | LC_ALL=C sort > /tmp/derived-B.txt \
            || fail "deriver --ref B failed (UNRESOLVED members — fail-closed)"
          test -s /tmp/derived-H.txt || fail "derived-H.txt empty"
          test -s /tmp/derived-B.txt || fail "derived-B.txt empty"
          # deriver 포맷 `<mode> <type> <sha><TAB><path>` — 줄 전수 대조.
          for f in /tmp/derived-H.txt /tmp/derived-B.txt; do
            LINES="$(wc -l < "$f")"
            BAD="$(awk -F'\t' 'NF!=2 || $1 !~ /^[0-9]+ [a-z]+ [0-9a-f]{40}$/{c++} END{print c+0}' "$f")"
            [ "$BAD" = "0" ] || fail "$f: $BAD of $LINES lines deviate from the deriver format"
          done

          git show "$HEAD_SHA":config/trusted_writer_set.json > /tmp/pin-H.json \
            || fail "config/trusted_writer_set.json missing at H=$HEAD_SHA"
          test -s /tmp/pin-H.json || fail "pin-H.json empty"
          PIN_HEAD_BLOB_SHA="$(git rev-parse "$HEAD_SHA:config/trusted_writer_set.json")" \
            || fail "cannot resolve the blob OID of trusted_writer_set.json at H=$HEAD_SHA"
          printf '%s' "$PIN_HEAD_BLOB_SHA" | grep -qE '^[0-9a-f]{40}$' \
            || fail "pinHeadBlobSha='$PIN_HEAD_BLOB_SHA' not a 40-hex blob OID"

          mkdir -p /tmp/derived-closure
          jq -n --arg schema "axiom/derived-closure-identity/v1" \
                --arg ch "$HEAD_SHA" --arg bs "$BASE_SHA" \
                --arg ph "$PIN_HEAD_BLOB_SHA" --arg ra "$RUN_ATTEMPT" \
            '{schema:$schema, candidateHeadSha:$ch, baseSha:$bs, pinHeadBlobSha:$ph, runAttempt:($ra|tonumber)}' \
            > /tmp/derived-closure/identity.json
          # identity.json 전부 검증 후 업로드 (40-hex/정수/스키마/키 집합).
          jq -e '(keys|sort) == (["baseSha","candidateHeadSha","pinHeadBlobSha","runAttempt","schema"]|sort)' \
            /tmp/derived-closure/identity.json >/dev/null \
            || fail "identity.json key set deviates from axiom/derived-closure-identity/v1"
          jq -e '.schema == "axiom/derived-closure-identity/v1"' \
            /tmp/derived-closure/identity.json >/dev/null \
            || fail "identity.json schema mismatch"
          for field in candidateHeadSha baseSha pinHeadBlobSha; do
            jq -r --arg f "$field" '.[$f]' /tmp/derived-closure/identity.json | grep -qE '^[0-9a-f]{40}$' \
              || fail "identity.json field '$field' is not 40-hex"
          done
          jq -e '.runAttempt | type == "number"' /tmp/derived-closure/identity.json >/dev/null \
            || fail "identity.json runAttempt is not an integer"
          [ "$(jq -r '.runAttempt' /tmp/derived-closure/identity.json)" = "$RUN_ATTEMPT" ] \
            || fail "identity.json runAttempt != github.run_attempt"
          [ "$(jq -r '.candidateHeadSha' /tmp/derived-closure/identity.json)" = "$HEAD_SHA" ] \
            || fail "identity.json candidateHeadSha != H"
          [ "$(jq -r '.baseSha' /tmp/derived-closure/identity.json)" = "$BASE_SHA" ] \
            || fail "identity.json baseSha != B"
          [ "$(jq -r '.pinHeadBlobSha' /tmp/derived-closure/identity.json)" = "$PIN_HEAD_BLOB_SHA" ] \
            || fail "identity.json pinHeadBlobSha != blob(H:config/trusted_writer_set.json)"
          cp /tmp/derived-H.txt /tmp/derived-B.txt /tmp/pin-H.json /tmp/derived-closure/

          echo "CLOSURE: OK — derived(H)=$(wc -l < /tmp/derived-H.txt) entries, derived(B)=$(wc -l < /tmp/derived-B.txt) entries, pinHeadBlobSha=$PIN_HEAD_BLOB_SHA, runAttempt=$RUN_ATTEMPT (identity schema axiom/derived-closure-identity/v1; pin@B not carried — consumer reads the B workspace directly)"

      - name: "[closure] Upload derived-closure (all-or-none 4 files — no overwrite)"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: derived-closure
          path: |
            /tmp/derived-closure/derived-H.txt
            /tmp/derived-closure/derived-B.txt
            /tmp/derived-closure/pin-H.json
            /tmp/derived-closure/identity.json
          if-no-files-found: error
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # attest — callee 래퍼 stage 1/2 (witness 산출 authority).
  # admission-check.yml을 `stage: attest`로 호출한다. callee는 B에서만
  # 빌드하고 witness bundle
  # (admission-check-<candidate head>-<run_attempt>)을 올린다 — 이부는
  # ADR-0022의 attestation tier만. MergeAdmissible 판정은 이 job이
  # 하지 않는다 (verdict job의 소관).
  # 분리 이유(순환 제거): 단일 `admission` job이 attest+predicate를
  # 겸하면 predicate가 cert를 읽는 시점이 mint-publish 이전이라
  # attempt 1이 NO_CERT로 닫히고 재실행이 필요했다
  # (2026-10-04 run 37199503612 실측). producer(attest)와 consumer(verdict)를
  # 별도 job으로 갈라 DAG에서
  #   attest ─> mint-prepare ─> mint-publish ─> verdict
  # 순서를 만들면 attempt 1에서 predicate가 이미 퍼블리시된
  # cert를 읽는다. needs: 없음 — DAG head.
  # job-level permissions = callee(admission-check.yml) top-level 선언과
  # 정확히 일치 (grant < callee 선언이면 호출 그래프 전체가 계획 단계에서
  # 거부되어 0-job startup_failure — 2026-09-26 첫 런 실증).
  # ──────────────────────────────────────────────────────────────
  attest:
    permissions:
      contents: read
      pull-requests: read
    uses: Archright/Axiom/.github/workflows/admission-check.yml@88b52abece2f18272d90f48883f7f1df699faaca
    with:
      stage: attest

  # ──────────────────────────────────────────────────────────────
  # mint-prepare — certificate-mint callee 래퍼 (SL-12, epoch N+4 승격).
  # certificate-mint.yml@4b7719e15382405c641f79c2f95db32218c90bcf (callee ssh fix chain: #340 G2a 페어 + #341 event_name — B3 해소)
  # (PR #329 feat/epoch-n5-sl04 — N+5 main merge sha, C5/C1 계약 개정:
  # prepare build-base-artifacts 소비) stage=prepare
  # (read tier — callee prepare job-level contents: read; publish는 N+4 K
  # 에서 미호출 — SL-0713 미정착).
  # needs: [attest] — callee prepare step (3)이 같은 run의
  # admission-check-<candidate head>-<run_attempt> witness artifact를 run-scoped API로 사용
  # (SL-03→SL-12 데이터 인과; 그 DAG 94a6f0864 freeze tag mint-prepare
  # needs:[admission] 실측 재확인). job-level permissions = callee
  # workflow_call top-level 선언과 정확히 일치 (grant < callee 선언 =
  # 호출 그래프 전체 0-job startup_failure, 2026-09-26 실증):
  # contents: write + actions: read + pull-requests: read. callee 내부
  # [slice-engine] 게이트가 manifest@B implementedSlices로 (4)/(5)/(5b)
  # 발화를 제한 (scope_sl12 — N+4 main: sl12=fire; 미정착 main =
  # NO-FIRE, verdict fail-closed).
  # ──────────────────────────────────────────────────────────────
  mint-prepare:
    needs: [attest]
    # Tolerate an upstream attest FAILURE, never survive cancellation.
    # `needs:` is kept because this callee genuinely consumes two artifacts the
    # `attest` call produces — `admission-check-base-artifacts` and the
    # `admission-check-<candidate head>-<run_attempt>` witness — fetched over the run-scoped
    # REST API with no poll/retry, so dropping the edge would race the producers and fail-closed
    # nondeterministically. What is wrong is the failure-propagation half: certificate
    # minting is an evidence authority (`signWitness(witness)` — the witness is its sole
    # input), so requiring attest to have SUCCEEDED inverts the causality and starves the
    # very certificate the verdict predicate demands (NO_CERT).
    # fail-closed is preserved: the aggregate job requires all five jobs to be `success`,
    # and it still runs `if: always()`.
    # and fail-closed nondeterministically. `needs:` also supplies the ordering
    # guarantee those single-shot fetches rely on. What is wrong is the
    # failure-propagation half: certificate minting is an evidence authority
    # (`signWitness(witness)` — the witness is its sole input, and the witness is
    # produced *before* the admission predicate and uploaded with `if: always()`),
    # so requiring admission to have SUCCEEDED inverts the causality and starves
    # the very certificate the predicate demands (NO_CERT).
    # fail-closed is preserved: the verdict job still requires all four jobs to be
    # `success`, and it still runs `if: always()`. Convergence is two-pass —
    # this run mints and publishes, the next run's predicate finds the ledger cert.
    if: ${{ !cancelled() }}
    permissions:
      contents: write
      actions: read
      pull-requests: read
    uses: Archright/Axiom/.github/workflows/certificate-mint.yml@88b52abece2f18272d90f48883f7f1df699faaca
    with:
      stage: prepare
      runId: ${{ github.run_id }}
      runAttempt: ${{ github.run_attempt }}
      headSha: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      baseSha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
      prNumber: ${{ github.event.pull_request.number || '0' }}

  # ──────────────────────────────────────────────────────────────
  # mint-publish — certificate-mint callee 래퍼 (SL-04, epoch N+5 승격).
  # certificate-mint.yml@6edfd7a50 (PR #329 feat/epoch-n5-sl04 —
  # N+5 main merge sha) stage=publish (write tier — THE single
  # contents: write grant in the gate; callee publish job-level
  # contents: write).
  # needs: [mint-prepare, gateway] — publish는 같은 run의
  # subject-certificate-<run_attempt> artifact를 run-scoped API로 소비하고
  # (SL-12→SL-04 데이터 인과), SL-0713 승격 이후 gateway lane의 결론을
  # 직접 평가한다 — callee (P5) tested-tree-digest artifact 소비 + (P6)
  # jobs API lane conclusion 집계. needs는 선행 job(호출 job 포함 — 호출
  # job은 callee workflow 완료에 완료)의 완료를 보장하므로(GitHub Actions
  # 공식: jobs.<job_id>.needs = "any jobs that must complete successfully
  # before this job will run"), "평가 대상 lane이 terminal 상태가 된 뒤에
  # 평가"가 그래프로 선언된다 — 타이밍/폴링 회피가 아닌 의존관계 선언.
  # gateway 간선 복원 배경(실측 run 37569755722 attempt 1, 2026-10-07):
  # 구 DAG 94a6f0864 freeze tag mint-publish
  # needs:[mint-prepare, gateway, tree-identity]에서 N+5 재등록 때
  # gateway/tree-identity가 제외되었으나 — 당시에는 P5/P6가 NO-FIRE라
  # 무해 — N+6 gateway 래퍼 부활 + SL-0713 승격으로 P5/P6가 발화하면서
  # 간선 부재가 레이스가 되었다: mint-publish가 gateway/ci-bootstrap
  # 완료(04:11:18Z) 전에 jobs API 평가(04:10:10Z)를 수행, in-progress
  # job을 "abnormal conclusion"으로 fail-closed (MINT_PUB_JOBS FAIL) →
  # 오검증 red → 런 전체 재실행에서만 green. [admission] 에지는 계속
  # 불필요 — publish callee는 admission artifact를 소비하지 않고 DAG
  # 폐쇄는 mint-prepare가 보장. gateway 실패/스킵 시에도 본 job은
  # if: !cancelled()로 실행을 계속한다(needed job 실패·스킵 시 조건식이
  # 있는 job은 계속 실행 — 공식 "unless the jobs use a conditional
  # expression that causes the job to continue") → callee (P6)가 lane의
  # 실제 결론을 fail-closed로 보고하고, 최종 admission-check aggregate가
  # RESULT_GATEWAY로 독립 차단한다(never green).
  # job-level permissions = callee workflow_call top-level 선언과 정확히
  # 일치 (contents: write + actions: read + pull-requests: read —
  # mint-prepare 래퍼와 동일 셋). callee 내부 [slice-engine] 게이트가
  # manifest@B implementedSlices로 publish step 발화를 제한
  # (scope_sl04 — N+5 main: sl04=fire · sl0713=NO-FIRE — P0/P5/P6/P7
  # skip 실측은 acceptance 기록).
  # ──────────────────────────────────────────────────────────────
  mint-publish:
    needs: [mint-prepare, gateway]
    # Same rationale as mint-prepare: the certificate must reach the ledger even
    # when this run's attest stage denied, otherwise the verdict predicate still
    # sees NO_CERT. Without this the chain stops at prepare and never converges.
    if: ${{ !cancelled() }}
    permissions:
      contents: write
      actions: read
      pull-requests: read
    uses: Archright/Axiom/.github/workflows/certificate-mint.yml@88b52abece2f18272d90f48883f7f1df699faaca
    with:
      stage: publish
      runId: ${{ github.run_id }}
      runAttempt: ${{ github.run_attempt }}
      headSha: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      baseSha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
      prNumber: ${{ github.event.pull_request.number || '0' }}

  # ──────────────────────────────────────────────────────────────
# gateway — runner-pool-acceptance callee 래퍼 (SL-10, epoch N+6
# 승격 — 첫 runner-pool(gateway lane) 증분). callee
# @<N+6 MAIN SHA> (PR #337 feat/epoch-n6-sl10 merge sha).
# needs: [closure-deriver] — SL-02 Phase 1-a 간선 복원 (구 DAG
# needs [closure-deriver]와 동일 배선). callee select 자체는 GITHUB_SHA/
# 이벤트 컨텍스트만 소비(타 job 산출물 0)하지만, gateway lane은 H 코드를
# 실행하는 잠재 경쟁 게시자이므로 생산자의 derived-closure 게시 완료
# 이후에만 시작해야 한다 (V-H 아티팩트 레이스 차단 — DAG 고정 계약).
# job-level permissions = callee workflow_call
# top-level 선언(contents: read)과 정확히 일치 (grant < callee
# 선언 = 호출 그래프 전체 0-job startup_failure 실증). callee
# 내부 [slice-engine] 게이트가 manifest@B implementedSlices로
# select의 decision envelope 발화를 제한 (scope_sl10 — N+6 main:
# sl10=fire).
# ──────────────────────────────────────────────────────────────
  gateway:
    needs: [closure-deriver]
    permissions:
      contents: read
    uses: Archright/Axiom/.github/workflows/runner-pool-acceptance.yml@88b52abece2f18272d90f48883f7f1df699faaca
    with:
      target_sha: ${{ github.sha }}
      force_full: false

  # ──────────────────────────────────────────────────────────────
  # admission-check — verdict. name = required check context
  # (repo ruleset 20303214 required_status_checks == ["admission-check"]),
  # 절대 불변.
  # callee result 단일 판정: success만 GREEN, 그 외(skipped/cancelled/
  # failed)는 exit 1 fail-closed "never green" — 구 verdict 1단계 패턴
  # 재사용 (나머지 다단계 predicate는 미정착 slice 소관으로 제거).
  # epoch N+4: verdict = admission ∧ mint-prepare (둘 다 success만
  # GREEN — SL-12 mint prepare 발화를 verdict에 결속; mint-prepare가
  # skipped/cancelled/failed면 required check red, fail-closed).
  # epoch N+5: verdict = admission ∧ mint-prepare ∧ mint-publish (셋 다
  # success만 GREEN — SL-04 [X]1~3 검증 발화를 verdict에 결속;
  # mint-publish가 skipped/cancelled/failed면 required check red,
  # fail-closed).
  # epoch N+6: verdict = admission ∧ mint-prepare ∧ mint-publish ∧
  # gateway (넷 다 success만 GREEN — SL-10 decision envelope 발화 +
  # gateway lane 결과를 verdict에 결속; gateway가 skipped/cancelled/
  # failed면 required check red, fail-closed).
  # stage-split cutover: verdict = attest ∧ mint-prepare ∧ mint-publish ∧
  # verdict ∧ gateway (난 대 success만 GREEN). 이전 4중에서 5중으로
  # 강화 — 언어마 MUST가 제거되지 않는다. 삭제된
  # `admission` job은 동일한 callee의 attest/verdict 두 stage 호출로
  # 대장되언고, 담당 해당로는 그대로의 MergeAdmissible
  # predicate authority 이상지는 그대로의 verdict stage가 기능한다.
  # 성가 요건(GREEN): certificate 발행이 여전히 필요 —
  # mint-prepare ∧ mint-publish 둘 MUST은 그대로다.
  # SL-02 Phase 1-a (2026-10-10): closure-deriver 생산자 복원으로
  # 6중 ∧로 강화 — closure-deriver(red/skipped/cancelled)는 required
  # check를 직접 차단하고, gateway·verdict의 needs 간선은 생산자 게시
  # 완료 순서를 보장한다 (V-H 아티팩트 레이스 차단). MUST는 강화될 뿐
  # 제거된 MUST는 없다.
  # merge_group 바인딩 (ADR-0027 queue-delegation, P1 — ADR-0026 인용 정정):
  # 래퍼는 headSha/baseSha를 merge_group.head_sha/base_sha로 전파하고
  # prNumber=0 (명시적 honest "no PR context" 값 — head_ref 파싱 금지)을
  # 전달한다. pull_request 경로는 기존 표현식과 byte 동일 (PR-path
  # neutral). stage-split 이후 attest·verdict 래퍼도 동일한
  # 표hj식을 전달한다.
  # ──────────────────────────────────────────────────────────────
  # ──────────────────────────────────────────────────────────────
  # verdict — callee 래퍼 stage 2/2 (MergeAdmissible 판정).
  # `attest`와 동일 SHA의 admission-check.yml을 `stage: verdict`로 한 번 더
  # 호출한다. callee는 이 단계에서 비로소 MergeAdmissible predicate를
  # 평가하고 그 exit code가 check conclusion에 투영된다 (SL-05).
  # needs: [mint-publish, closure-deriver] — predicate의 certificate source는 같은 run의
  # subject-certificate-<run_attempt> artifact (ADR-0022 §D5-3 `--cert`)이므로
  # 퍼블리시 이후에만 판정한다. 이 엣지가 없으면 predicate는 NO_CERT로 닫힌다.
  # closure-deriver 간선: verdict stage는 derived-closure 아티팩트의 소비자 —
  # 생산자 게시 완료 이후에만 판정한다 (V-H 아티팩트 레이스 차단,
  # SL-02 Phase 1-a DAG 고정). closure-deriver 실패 시에도 본 job은
  # if: !cancelled()로 실행을 계속한다(조건식 job은 needed job 실패·스킵에도
  # 계속 — 공식) → callee가 부재/불완전 아티팩트를 fail-closed로 보고하고,
  # aggregate의 6중 ∧가 독립 차단한다(never green).
  #   attest ─> mint-prepare ─> mint-publish ─> verdict
  #   closure-deriver ─────────────────────────┘ (needs 간선 — 게시 순서만)
  # 이 경로에 역방향 엣지가 없으므로 사이클이 없다. cycle은 GitHub가
  # 계획 단계에서 job 0개로 전체 거부한다
  # (docs/evidence/org_gate_handoff_2026-10-04.md §4).
  # if: !cancelled() — mint 실패 때도 판정 관측을 남긴다 (진단 가치).
  # GREEN은 아래 aggregate의 6중 ∧가 결정하므로 이 job의 성공/실패가
  # 관측 가능성을 바꾸지 않는다 (실패해도 aggregate는 항상 실패로 닫힌다).
  # job-level permissions = callee(admission-check.yml) top-level 선언과
  # 정확히 일치 (grant < callee 선언이면 호출 그래프 전체가 계획 단계에서
  # 거부되어 0-job startup_failure).
  # ──────────────────────────────────────────────────────────────
  verdict:
    needs: [mint-publish, closure-deriver]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pull-requests: read
    uses: Archright/Axiom/.github/workflows/admission-check.yml@88b52abece2f18272d90f48883f7f1df699faaca
    with:
      stage: verdict

  admission-check:
    name: admission-check
    needs: [closure-deriver, attest, mint-prepare, mint-publish, verdict, gateway]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "[verdict] Every needed job must be success (skipped -> FAILURE, never green)"
        env:
          RESULT_CLOSURE_DERIVER: ${{ needs.closure-deriver.result }}
          RESULT_ATTEST: ${{ needs.attest.result }}
          RESULT_MINT_PREPARE: ${{ needs.mint-prepare.result }}
          RESULT_MINT_PUBLISH: ${{ needs.mint-publish.result }}
          RESULT_VERDICT: ${{ needs.verdict.result }}
          RESULT_GATEWAY: ${{ needs.gateway.result }}
        run: |
          set -euo pipefail
          fail() { echo "ADMISSION_GATE: FAIL — $1 (fail-closed)" >&2; exit 1; }
          [ "$RESULT_CLOSURE_DERIVER" = "success" ] \
            || fail "needed job 'closure-deriver' result='$RESULT_CLOSURE_DERIVER' (expected 'success' — skipped/cancelled/failed must block, never green)"
          [ "$RESULT_ATTEST" = "success" ] \
            || fail "needed job 'attest' result='$RESULT_ATTEST' (expected 'success' — skipped/cancelled/failed must block, never green)"
          [ "$RESULT_MINT_PREPARE" = "success" ] \
            || fail "needed job 'mint-prepare' result='$RESULT_MINT_PREPARE' (expected 'success' — skipped/cancelled/failed must block, never green)"
          [ "$RESULT_MINT_PUBLISH" = "success" ] \
            || fail "needed job 'mint-publish' result='$RESULT_MINT_PUBLISH' (expected 'success' — skipped/cancelled/failed must block, never green)"
          [ "$RESULT_VERDICT" = "success" ] \
            || fail "needed job 'verdict' result='$RESULT_VERDICT' (expected 'success' — skipped/cancelled/failed must block, never green)"
          [ "$RESULT_GATEWAY" = "success" ] \
            || fail "needed job 'gateway' result='$RESULT_GATEWAY' (expected 'success' — skipped/cancelled/failed must block, never green)"
          echo "[verdict] OK — closure-deriver ∧ attest ∧ mint-prepare ∧ mint-publish ∧ verdict ∧ gateway callee succeeded"
