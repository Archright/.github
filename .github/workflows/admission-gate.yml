# ────────────────────────────────────────────────────────────────
# admission-gate — Control Kernel (K). N+1 activation
# (CI Quantization prefix construction — Bootstrap Authority 창의 ③,
# 새 I-chain 형성). Epoch N+4 extension: mint-prepare 래퍼 신설
# (SL-12 certificate mint prepare — certificate-mint.yml@N+4 main sha,
# needs [admission]) + verdict needs [admission, mint-prepare] — verdict
# = callee result 단일 판정의 확장 (둘 다 success만 GREEN, fail-closed).
# Epoch N+5 extension: mint-publish 래퍼 신설 (SL-04 certificate
# validity — certificate-mint.yml@N+5 main sha, stage=publish,
# needs [mint-prepare]) + verdict needs [admission, mint-prepare,
# mint-publish] — SL-04 [X]1~3 검증 발화를 verdict에 결속 (셋 다
# success만 GREEN). C5/C1 계약 개정 반영: callee prepare는 N+5 main부터
# build-base-artifacts 소비 (자체빌드 폐기).
# Epoch N+6 extension: gateway 래퍼 신설 (SL-10 gateway decision
# identity — runner-pool-acceptance.yml@N+6 main sha, needs 없음:
# callee select는 GITHUB_SHA만 소비) + verdict needs [admission,
# mint-prepare, mint-publish, gateway] — SL-10 decision envelope
# 발화 + gateway lane 결과를 verdict에 결속 (넷 다 success만 GREEN).
# FORWARD (2026-09-29, 복구 D3): 수리 PR #331/#332/#333/#334 착지 —
# K를 N+5 shape로 복귀 (양쪽 래퍼 @c55f0482e — ircheck 소비 + P3 mkdir
# + libpcre3 패리티 prepare·publish). N+5는 복구 E의 acceptance green
# 까지 미완·전이 상태.
#
# K = "GitHub가 이 epoch을 실행하게 하는 최소 제어 장치" (핸들만 —
# semantic 엔진 코드 잔존 금지). semantic 실행 범위는 callee
# (admission-check.yml@B / certificate-mint.yml@B) 내부의 Slice Engine
# 게이트가 운전한다: manifest(config/policy/epoch_manifest.json @B)
# implementedSlices에서 구현 slice 단계만 발화하고, 미정착 slice 단계는
# 실행 목록에서 제외되어 NO-FIRE (I-3 — skip이 아니라 미발화). verdict는
# callee result 단일 판정 — callee 내부의 fail-closed manifest 파싱 +
# 슬라이스 검증이 epoch의 semantics다.
#
# required check context = admission-check (JOB NAME) 불변 — 이 파일의
# 존재 조건. org ruleset 24041674(axiom-admission-gate)의 workflows
# 규칙이 이 파일을 sha pin하며, Axiom repo ruleset 20303214의
# required_status_checks == ["admission-check"]가 verdict를 소비한다.
# required check 이름·bypass_actors·enforcement 공백은 전부 불변.
#
# 구 엔진(5-job DAG: closure-deriver / gateway / tree-identity /
# admission / mint-prepare / mint-publish — 마지막 상태 freeze tag
# 94a6f0864, old-ci-freeze-20260928)에서 K가 제거한 것 (I-3 미정착
# slice — 무엇이 빠지는지 대조용 참조만, 복사 아님):
#   closure-deriver — SL-02 deriver 컴파일·실행 + closure 등식
#                     (callee 내부 derived-closure load도 scope_sl02
#                      게이트로 NO-FIRE)
#   gateway         — runner-pool-acceptance H-code 전면 실행; epoch N+6
#                     (SL-10)에서 부활 (아래 gateway 래퍼) — callee 내부
#                     [slice-engine] scope_sl10 게이트로 decision
#                     envelope 발화 제한 (첫 runner-pool 증분)
#   tree-identity   — testedTree==mergeTree 등식 (callee가 mergeTree
#                     재유도 = 순수 중복)
#   mint-prepare    — epoch N+4 (SL-12)에서 부활 (아래 mint-prepare
#                     래퍼) — certificate-mint prepare read tier
#   mint-publish    — epoch N+5 (SL-04)에서 부활 (아래 mint-publish
#                     래퍼) — certificate-mint publish write tier;
#                     publish 내부 P0/P5/P6/P7은 scope_sl0713 게이트로
#                     NO-FIRE (SL-0713 미정착 — D6/[B2] 대기)
# verdict 다단계(identity+qualification+certificate predicate)도 축소 —
# K verdict = callee result 단일 판정 (fail-closed, "never green").
#
# Bootstrap Bridge(org PR #16, a7668c898)는 R0 선언 시점에 조기 퇴역 —
# 본 파일이 그 자리에 새 I-chain을 처음 형성한다 (B10 창의 ③,
# I-12 1회성).
# ────────────────────────────────────────────────────────────────
name: admission-gate

on:
  pull_request:
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────
  # admission — callee 래퍼 (구 DAG의 admission 래퍼 패턴 재사용).
  # B-pinned definition: workflow_call: {} — callee가 전파된
  # pull_request caller context에서 B/H/PR 사실을 전부 유도한다
  # (inputs/secrets 없음 — 전달 없음). 실행 job은 callee 내부에 있으며
  # slice-engine 게이트로 범위 제한된다.
  # job-level permissions = callee(admission-check.yml) top-level 선언과
  # 정확히 일치 (grant < callee 선언이면 호출 그래프 전체가 계획 단계에서
  # 거부되어 0-job startup_failure — 2026-09-26 첫 런 실증). callee의
  # landing-trigger Check Run POST가 checks: write를 사용한다.
  # ──────────────────────────────────────────────────────────────
  admission:
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: write
    uses: Archright/Axiom/.github/workflows/admission-check.yml@2a7858ef34e9bb5491bdb65f834908ed5c9298f1

  # ──────────────────────────────────────────────────────────────
  # mint-prepare — certificate-mint callee 래퍼 (SL-12, epoch N+4 승격).
  # certificate-mint.yml@2a7858ef34e9bb5491bdb65f834908ed5c9298f1 (callee ssh fix chain: #340 G2a 페어 + #341 event_name — B3 해소)
  # (PR #329 feat/epoch-n5-sl04 — N+5 main merge sha, C5/C1 계약 개정:
  # prepare build-base-artifacts 소비) stage=prepare
  # (read tier — callee prepare job-level contents: read; publish는 N+4 K
  # 에서 미호출 — SL-0713 미정착).
  # needs: [admission] — callee prepare step (3)이 같은 run의
  # admission-check-<PR> witness artifact를 run-scoped API로 소비
  # (SL-03→SL-12 데이터 인과; 구 DAG 94a6f0864 freeze tag mint-prepare
  # needs:[admission] 실측 재확인). job-level permissions = callee
  # workflow_call top-level 선언과 정확히 일치 (grant < callee 선언 =
  # 호출 그래프 전체 0-job startup_failure, 2026-09-26 실증):
  # contents: write + actions: read + pull-requests: read. callee 내부
  # [slice-engine] 게이트가 manifest@B implementedSlices로 (4)/(5)/(5b)
  # 발화를 제한 (scope_sl12 — N+4 main: sl12=fire; 미정착 main =
  # NO-FIRE, verdict fail-closed).
  # ──────────────────────────────────────────────────────────────
  mint-prepare:
    needs: [admission]
    permissions:
      contents: write
      actions: read
      pull-requests: read
    uses: Archright/Axiom/.github/workflows/certificate-mint.yml@2a7858ef34e9bb5491bdb65f834908ed5c9298f1
    with:
      stage: prepare
      runId: ${{ github.run_id }}
      runAttempt: ${{ github.run_attempt }}
      headSha: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      baseSha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
      prNumber: ${{ github.event.pull_request.number || '0' }}

  # ──────────────────────────────────────────────────────────────
  # mint-publish — certificate-mint callee 래퍼 (SL-04, epoch N+5 승격).
  # certificate-mint.yml@6edfd7a50 (PR #329 feat/epoch-n5-sl04 —
  # N+5 main merge sha) stage=publish (write tier — THE single
  # contents: write grant in the gate; callee publish job-level
  # contents: write).
  # needs: [mint-prepare] — publish는 같은 run의
  # subject-certificate-<run_attempt> artifact를 run-scoped API로 소비
  # (SL-12→SL-04 데이터 인과; 구 DAG 94a6f0864 freeze tag mint-publish
  # needs:[mint-prepare, gateway, tree-identity]에서 gateway/tree-identity
  # 미정착 제외 실측 — publish callee는 admission artifact를 소비하지
  # 않으므로 [admission] 에지 불필요, DAG 폐쇄는 mint-prepare가 보장).
  # job-level permissions = callee workflow_call top-level 선언과 정확히
  # 일치 (contents: write + actions: read + pull-requests: read —
  # mint-prepare 래퍼와 동일 셋). callee 내부 [slice-engine] 게이트가
  # manifest@B implementedSlices로 publish step 발화를 제한
  # (scope_sl04 — N+5 main: sl04=fire · sl0713=NO-FIRE — P0/P5/P6/P7
  # skip 실측은 acceptance 기록).
  # ──────────────────────────────────────────────────────────────
  mint-publish:
    needs: [mint-prepare]
    permissions:
      contents: write
      actions: read
      pull-requests: read
    uses: Archright/Axiom/.github/workflows/certificate-mint.yml@2a7858ef34e9bb5491bdb65f834908ed5c9298f1
    with:
      stage: publish
      runId: ${{ github.run_id }}
      runAttempt: ${{ github.run_attempt }}
      headSha: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      baseSha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
      prNumber: ${{ github.event.pull_request.number || '0' }}

  # ──────────────────────────────────────────────────────────────
# gateway — runner-pool-acceptance callee 래퍼 (SL-10, epoch N+6
# 승격 — 첫 runner-pool(gateway lane) 증분). callee
# @<N+6 MAIN SHA> (PR #337 feat/epoch-n6-sl10 merge sha).
# needs: 없음 (실측: callee select는 GITHUB_SHA/이벤트 컨텍스트만
# 소비 — 타 job 산출물 0; 구 DAG의 needs [closure-deriver]는
# 제거된 엔진 소관). job-level permissions = callee workflow_call
# top-level 선언(contents: read)과 정확히 일치 (grant < callee
# 선언 = 호출 그래프 전체 0-job startup_failure 실증). callee
# 내부 [slice-engine] 게이트가 manifest@B implementedSlices로
# select의 decision envelope 발화를 제한 (scope_sl10 — N+6 main:
# sl10=fire).
# ──────────────────────────────────────────────────────────────
  gateway:
    permissions:
      contents: read
    uses: Archright/Axiom/.github/workflows/runner-pool-acceptance.yml@2a7858ef34e9bb5491bdb65f834908ed5c9298f1
    with:
      target_sha: ${{ github.sha }}
      force_full: false

  # ──────────────────────────────────────────────────────────────
  # admission-check — verdict. name = required check context
  # (repo ruleset 20303214 required_status_checks == ["admission-check"]),
  # 절대 불변.
  # callee result 단일 판정: success만 GREEN, 그 외(skipped/cancelled/
  # failed)는 exit 1 fail-closed "never green" — 구 verdict 1단계 패턴
  # 재사용 (나머지 다단계 predicate는 미정착 slice 소관으로 제거).
  # epoch N+4: verdict = admission ∧ mint-prepare (둘 다 success만
  # GREEN — SL-12 mint prepare 발화를 verdict에 결속; mint-prepare가
  # skipped/cancelled/failed면 required check red, fail-closed).
  # epoch N+5: verdict = admission ∧ mint-prepare ∧ mint-publish (셋 다
  # success만 GREEN — SL-04 [X]1~3 검증 발화를 verdict에 결속;
  # mint-publish가 skipped/cancelled/failed면 required check red,
  # fail-closed).
  # epoch N+6: verdict = admission ∧ mint-prepare ∧ mint-publish ∧
  # gateway (넷 다 success만 GREEN — SL-10 decision envelope 발화 +
  # gateway lane 결과를 verdict에 결속; gateway가 skipped/cancelled/
  # failed면 required check red, fail-closed).
  # merge_group 바인딩 (ADR-0027 queue-delegation, P1 — ADR-0026 인용 정정):
  # 래퍼는 headSha/baseSha를 merge_group.head_sha/base_sha로 전파하고
  # prNumber=0 (명시적 honest "no PR context" 값 — head_ref 파싱 금지)을
  # 전달한다. pull_request 경로는 기존 표현식과 byte 동일 (PR-path
  # neutral). callee-side merge_group 지원이 Archright/Axiom main에 착지
  # (#353 admission-binding · #354 mint-binding, α subject = (B, G^2);
  # evidence docs/evidence/merge_queue_probe_2026-09-29.md) — 본 핀을
  # 그 SHA로 상승시켜 신규 callee를 활성화한다 (atomic binding cutover).
  # ──────────────────────────────────────────────────────────────
  admission-check:
    name: admission-check
    needs: [admission, mint-prepare, mint-publish, gateway]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "[verdict] Every needed job must be success (skipped -> FAILURE, never green)"
        env:
          RESULT_ADMISSION: ${{ needs.admission.result }}
          RESULT_MINT_PREPARE: ${{ needs.mint-prepare.result }}
          RESULT_MINT_PUBLISH: ${{ needs.mint-publish.result }}
          RESULT_GATEWAY: ${{ needs.gateway.result }}
        run: |
          set -euo pipefail
          fail() { echo "ADMISSION_GATE: FAIL — $1 (fail-closed)" >&2; exit 1; }
          [ "$RESULT_ADMISSION" = "success" ] \
            || fail "needed job 'admission' result='$RESULT_ADMISSION' (expected 'success' — skipped/cancelled/failed must block, never green)"
          [ "$RESULT_MINT_PREPARE" = "success" ] \
            || fail "needed job 'mint-prepare' result='$RESULT_MINT_PREPARE' (expected 'success' — skipped/cancelled/failed must block, never green)"
          [ "$RESULT_MINT_PUBLISH" = "success" ] \
            || fail "needed job 'mint-publish' result='$RESULT_MINT_PUBLISH' (expected 'success' — skipped/cancelled/failed must block, never green)"
          [ "$RESULT_GATEWAY" = "success" ] \
            || fail "needed job 'gateway' result='$RESULT_GATEWAY' (expected 'success' — skipped/cancelled/failed must block, never green)"
          echo "[verdict] OK — admission ∧ mint-prepare ∧ mint-publish ∧ gateway callee succeeded"