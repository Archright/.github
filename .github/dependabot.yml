version: 2
registries:
  github-axiom:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{secrets.AXIOM_READONLY_TOKEN}}
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    registries:
      - github-axiom
