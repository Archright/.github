# ④ 전 경로 평가 세대(9d82b5ca) 반영 핀 회전 트리거
# rotation 정합 fix(88b52abe) 반영 핀 회전 트리거
# verdict deriver toolchain fix(73ed69a5) 반영 핀 회전 트리거
# DEBT#501 큐 치료 in-place derived-closure 유도(#659 e54de52e4) 반영 핀 회전 트리거
# P7c-x venue gate fix(a24abfc8e) 반영 핀 회전 트리거
# judgment CAS 3주체 mint(#626 aaf2ca9d8) 반영 핀 회전 트리거
# S5 build-skip(62294da2) 반영 핀 회전 트리거
# Q4 주석 회피 fix(f68049cd9) 반영 핀 회전 트리거
# quirk Q4 fix(49fdfba1e) 반영 핀 회전 트리거
# callee pin 회전은 main 갱신 시 이 설정 변경/스케줄 job이 트리거한다 (venue-split 활성화용)
version: 2
registries:
  github-axiom:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{secrets.AXIOM_READONLY_TOKEN}}
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:30"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 12
    cooldown:
      default-days: 0
    registries:
      - github-axiom
